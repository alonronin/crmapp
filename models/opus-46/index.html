<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearCRM — Simple CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .fade-in { animation: fadeIn .2s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:translateY(0) } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    /* ─── Helpers ─── */
    const uid = () => crypto.randomUUID?.() || Math.random().toString(36).slice(2);
    const LS_KEY = 'clearcrm_data';
    const loadData = () => {
        try { return JSON.parse(localStorage.getItem(LS_KEY)) } catch { return null }
    };
    const saveData = (d) => localStorage.setItem(LS_KEY, JSON.stringify(d));

    const STAGES = ['Lead', 'Qualified', 'Proposal', 'Negotiation', 'Closed Won', 'Closed Lost'];
    const STAGE_COLORS = {
        'Lead': 'bg-gray-200 text-gray-700',
        'Qualified': 'bg-blue-100 text-blue-700',
        'Proposal': 'bg-yellow-100 text-yellow-700',
        'Negotiation': 'bg-orange-100 text-orange-700',
        'Closed Won': 'bg-green-100 text-green-700',
        'Closed Lost': 'bg-red-100 text-red-700',
    };

    const defaultData = () => ({
        contacts: [
            { id: uid(), name: 'Alice Johnson', email: 'alice@example.com', phone: '+1 555-0101', company: 'Acme Corp', notes: 'Key decision maker', createdAt: Date.now() },
            { id: uid(), name: 'Bob Smith', email: 'bob@example.com', phone: '+1 555-0102', company: 'Globex Inc', notes: '', createdAt: Date.now() },
            { id: uid(), name: 'Carol Williams', email: 'carol@example.com', phone: '+1 555-0103', company: 'Initech', notes: 'Referred by Bob', createdAt: Date.now() },
        ],
        deals: [
            { id: uid(), title: 'Acme Enterprise Plan', value: 24000, stage: 'Proposal', contactId: null, createdAt: Date.now() },
            { id: uid(), title: 'Globex Onboarding', value: 8500, stage: 'Lead', contactId: null, createdAt: Date.now() },
        ],
        activities: [
            { id: uid(), type: 'Call', description: 'Intro call with Alice', contactId: null, date: new Date().toISOString().slice(0,10), done: false },
        ],
    });

    /* ─── Context ─── */
    const CRMContext = createContext();
    const useCRM = () => useContext(CRMContext);

    function CRMProvider({ children }) {
        const [data, setData] = useState(() => loadData() || defaultData());
        useEffect(() => saveData(data), [data]);

        const update = useCallback((fn) => setData(prev => { const d = structuredClone(prev); fn(d); return d; }), []);
        const addContact = (c) => update(d => d.contacts.push({ id: uid(), createdAt: Date.now(), ...c }));
        const updateContact = (id, c) => update(d => { const i = d.contacts.findIndex(x=>x.id===id); if(i>=0) Object.assign(d.contacts[i], c); });
        const deleteContact = (id) => update(d => { d.contacts = d.contacts.filter(x=>x.id!==id); });
        const addDeal = (dl) => update(d => d.deals.push({ id: uid(), createdAt: Date.now(), ...dl }));
        const updateDeal = (id, dl) => update(d => { const i = d.deals.findIndex(x=>x.id===id); if(i>=0) Object.assign(d.deals[i], dl); });
        const deleteDeal = (id) => update(d => { d.deals = d.deals.filter(x=>x.id!==id); });
        const addActivity = (a) => update(d => d.activities.push({ id: uid(), ...a }));
        const updateActivity = (id, a) => update(d => { const i = d.activities.findIndex(x=>x.id===id); if(i>=0) Object.assign(d.activities[i], a); });
        const deleteActivity = (id) => update(d => { d.activities = d.activities.filter(x=>x.id!==id); });

        return (
            <CRMContext.Provider value={{ ...data, addContact, updateContact, deleteContact, addDeal, updateDeal, deleteDeal, addActivity, updateActivity, deleteActivity }}>
                {children}
            </CRMContext.Provider>
        );
    }

    /* ─── UI Components ─── */
    const Badge = ({ stage }) => <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${STAGE_COLORS[stage]||'bg-gray-100'}`}>{stage}</span>;

    const Modal = ({ open, onClose, title, children }) => {
        if (!open) return null;
        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onClick={onClose}>
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-auto fade-in" onClick={e=>e.stopPropagation()}>
                    <div className="flex items-center justify-between px-6 py-4 border-b">
                        <h2 className="text-lg font-semibold">{title}</h2>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
                    </div>
                    <div className="p-6">{children}</div>
                </div>
            </div>
        );
    };

    const Input = ({ label, ...props }) => (
        <label className="block mb-3">
            <span className="text-sm font-medium text-gray-600">{label}</span>
            <input {...props} className="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
        </label>
    );

    const Select = ({ label, options, ...props }) => (
        <label className="block mb-3">
            <span className="text-sm font-medium text-gray-600">{label}</span>
            <select {...props} className="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition">
                {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
        </label>
    );

    const Btn = ({ variant='primary', className='', ...props }) => {
        const base = 'px-4 py-2 rounded-lg text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-offset-1';
        const v = {
            primary: 'bg-brand-600 text-white hover:bg-brand-700 focus:ring-brand-500',
            secondary: 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-gray-300',
            danger: 'bg-red-600 text-white hover:bg-red-700 focus:ring-red-400',
            ghost: 'text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:ring-gray-300',
        };
        return <button className={`${base} ${v[variant]} ${className}`} {...props} />;
    };

    const EmptyState = ({ icon, text }) => (
        <div className="text-center py-16 text-gray-400">
            <div className="text-4xl mb-2">{icon}</div>
            <p>{text}</p>
        </div>
    );

    /* ─── Pages ─── */

    // Dashboard
    function Dashboard() {
        const { contacts, deals, activities } = useCRM();
        const totalPipeline = deals.filter(d => !d.stage.startsWith('Closed')).reduce((s,d) => s+Number(d.value||0), 0);
        const wonValue = deals.filter(d => d.stage === 'Closed Won').reduce((s,d) => s+Number(d.value||0), 0);
        const openActivities = activities.filter(a => !a.done).length;

        const statCards = [
            { label: 'Total Contacts', value: contacts.length, icon: '👥', color: 'border-blue-400' },
            { label: 'Open Pipeline', value: `$${totalPipeline.toLocaleString()}`, icon: '📊', color: 'border-yellow-400' },
            { label: 'Closed Won', value: `$${wonValue.toLocaleString()}`, icon: '🏆', color: 'border-green-400' },
            { label: 'Open Tasks', value: openActivities, icon: '📋', color: 'border-purple-400' },
        ];

        const pipelineSummary = STAGES.filter(s => !s.startsWith('Closed')).map(stage => {
            const d = deals.filter(x => x.stage === stage);
            return { stage, count: d.length, value: d.reduce((s,x) => s+Number(x.value||0), 0) };
        });

        return (
            <div className="fade-in">
                <h1 className="text-2xl font-bold mb-6">Dashboard</h1>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    {statCards.map(c => (
                        <div key={c.label} className={`bg-white rounded-xl p-5 shadow-sm border-l-4 ${c.color}`}>
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-xs text-gray-500 uppercase tracking-wide">{c.label}</p>
                                    <p className="text-2xl font-bold mt-1">{c.value}</p>
                                </div>
                                <span className="text-3xl">{c.icon}</span>
                            </div>
                        </div>
                    ))}
                </div>

                <div className="bg-white rounded-xl shadow-sm p-6 mb-6">
                    <h2 className="font-semibold mb-4">Pipeline Overview</h2>
                    <div className="space-y-3">
                        {pipelineSummary.map(p => (
                            <div key={p.stage} className="flex items-center gap-3">
                                <span className="w-28 text-sm text-gray-600">{p.stage}</span>
                                <div className="flex-1 bg-gray-100 rounded-full h-6 overflow-hidden">
                                    <div className="bg-brand-500 h-6 rounded-full flex items-center px-2 text-xs text-white font-medium transition-all"
                                         style={{ width: `${Math.min(100, totalPipeline ? (p.value/totalPipeline)*100 : 0)}%`, minWidth: p.value ? '2.5rem' : 0 }}>
                                        {p.count > 0 && `$${p.value.toLocaleString()}`}
                                    </div>
                                </div>
                                <span className="text-xs text-gray-400 w-16 text-right">{p.count} deal{p.count!==1?'s':''}</span>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm p-6">
                    <h2 className="font-semibold mb-4">Recent Activities</h2>
                    {activities.slice(-5).reverse().map(a => (
                        <div key={a.id} className="flex items-center gap-3 py-2 border-b last:border-0">
                            <span className={`w-2 h-2 rounded-full ${a.done ? 'bg-green-400' : 'bg-yellow-400'}`} />
                            <span className="text-sm flex-1">{a.description}</span>
                            <span className="text-xs text-gray-400">{a.date}</span>
                        </div>
                    ))}
                    {activities.length === 0 && <p className="text-sm text-gray-400">No activities yet.</p>}
                </div>
            </div>
        );
    }

    // Contacts
    function Contacts() {
        const { contacts, addContact, updateContact, deleteContact } = useCRM();
        const [search, setSearch] = useState('');
        const [modal, setModal] = useState(null); // null | 'add' | contact obj
        const [form, setForm] = useState({});

        const filtered = useMemo(() => {
            const q = search.toLowerCase();
            return contacts.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.company?.toLowerCase().includes(q));
        }, [contacts, search]);

        const openAdd = () => { setForm({ name:'', email:'', phone:'', company:'', notes:'' }); setModal('add'); };
        const openEdit = (c) => { setForm({...c}); setModal(c); };
        const save = () => {
            if (!form.name) return;
            if (modal === 'add') addContact(form); else updateContact(form.id, form);
            setModal(null);
        };

        return (
            <div className="fade-in">
                <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
                    <h1 className="text-2xl font-bold">Contacts</h1>
                    <Btn onClick={openAdd}>+ Add Contact</Btn>
                </div>
                <input placeholder="Search contacts..." value={search} onChange={e=>setSearch(e.target.value)}
                       className="w-full mb-4 rounded-lg border border-gray-300 px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none" />

                {filtered.length === 0 ? <EmptyState icon="👤" text="No contacts found" /> : (
                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-sm">
                            <thead className="bg-gray-50 text-left text-xs uppercase text-gray-500">
                            <tr>
                                <th className="px-4 py-3">Name</th>
                                <th className="px-4 py-3 hidden md:table-cell">Email</th>
                                <th className="px-4 py-3 hidden lg:table-cell">Phone</th>
                                <th className="px-4 py-3 hidden sm:table-cell">Company</th>
                                <th className="px-4 py-3 w-20"></th>
                            </tr>
                            </thead>
                            <tbody className="divide-y">
                            {filtered.map(c => (
                                <tr key={c.id} className="hover:bg-gray-50 cursor-pointer" onClick={()=>openEdit(c)}>
                                    <td className="px-4 py-3 font-medium">{c.name}</td>
                                    <td className="px-4 py-3 hidden md:table-cell text-gray-500">{c.email}</td>
                                    <td className="px-4 py-3 hidden lg:table-cell text-gray-500">{c.phone}</td>
                                    <td className="px-4 py-3 hidden sm:table-cell text-gray-500">{c.company}</td>
                                    <td className="px-4 py-3">
                                        <button onClick={e=>{e.stopPropagation();deleteContact(c.id)}} className="text-red-400 hover:text-red-600 text-xs">Delete</button>
                                    </td>
                                </tr>
                            ))}
                            </tbody>
                        </table>
                    </div>
                )}

                <Modal open={!!modal} onClose={()=>setModal(null)} title={modal==='add' ? 'New Contact' : 'Edit Contact'}>
                    <Input label="Name" value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})} />
                    <Input label="Email" type="email" value={form.email||''} onChange={e=>setForm({...form,email:e.target.value})} />
                    <Input label="Phone" value={form.phone||''} onChange={e=>setForm({...form,phone:e.target.value})} />
                    <Input label="Company" value={form.company||''} onChange={e=>setForm({...form,company:e.target.value})} />
                    <label className="block mb-3">
                        <span className="text-sm font-medium text-gray-600">Notes</span>
                        <textarea rows={3} value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}
                                  className="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none" />
                    </label>
                    <div className="flex justify-end gap-2 mt-4">
                        <Btn variant="secondary" onClick={()=>setModal(null)}>Cancel</Btn>
                        <Btn onClick={save}>Save</Btn>
                    </div>
                </Modal>
            </div>
        );
    }

    // Deals
    function Deals() {
        const { deals, contacts, addDeal, updateDeal, deleteDeal } = useCRM();
        const [view, setView] = useState('board'); // board | list
        const [modal, setModal] = useState(null);
        const [form, setForm] = useState({});

        const openAdd = () => { setForm({ title:'', value:'', stage:'Lead', contactId:'' }); setModal('add'); };
        const openEdit = (d) => { setForm({...d}); setModal(d); };
        const save = () => {
            if (!form.title) return;
            if (modal === 'add') addDeal(form); else updateDeal(form.id, form);
            setModal(null);
        };

        const contactOpts = [{ value:'', label:'— None —' }, ...contacts.map(c => ({ value: c.id, label: c.name }))];
        const stageOpts = STAGES.map(s => ({ value: s, label: s }));

        return (
            <div className="fade-in">
                <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
                    <h1 className="text-2xl font-bold">Deals</h1>
                    <div className="flex gap-2">
                        <Btn variant={view==='board'?'primary':'secondary'} onClick={()=>setView('board')}>Board</Btn>
                        <Btn variant={view==='list'?'primary':'secondary'} onClick={()=>setView('list')}>List</Btn>
                        <Btn onClick={openAdd}>+ Add Deal</Btn>
                    </div>
                </div>

                {view === 'board' ? (
                    <div className="flex gap-4 overflow-x-auto pb-4">
                        {STAGES.map(stage => {
                            const stageDeals = deals.filter(d => d.stage === stage);
                            return (
                                <div key={stage} className="min-w-[240px] flex-shrink-0">
                                    <div className="flex items-center gap-2 mb-3">
                                        <Badge stage={stage} />
                                        <span className="text-xs text-gray-400">{stageDeals.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {stageDeals.map(d => (
                                            <div key={d.id} onClick={()=>openEdit(d)}
                                                 className="bg-white rounded-lg p-3 shadow-sm border border-gray-100 hover:shadow-md cursor-pointer transition">
                                                <p className="font-medium text-sm">{d.title}</p>
                                                <p className="text-brand-600 font-semibold text-sm mt-1">${Number(d.value||0).toLocaleString()}</p>
                                                {d.contactId && <p className="text-xs text-gray-400 mt-1">{contacts.find(c=>c.id===d.contactId)?.name}</p>}
                                            </div>
                                        ))}
                                        {stageDeals.length === 0 && <p className="text-xs text-gray-300 text-center py-4">No deals</p>}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                ) : (
                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-sm">
                            <thead className="bg-gray-50 text-left text-xs uppercase text-gray-500">
                            <tr>
                                <th className="px-4 py-3">Deal</th>
                                <th className="px-4 py-3">Value</th>
                                <th className="px-4 py-3 hidden sm:table-cell">Stage</th>
                                <th className="px-4 py-3 hidden md:table-cell">Contact</th>
                                <th className="px-4 py-3 w-20"></th>
                            </tr>
                            </thead>
                            <tbody className="divide-y">
                            {deals.map(d => (
                                <tr key={d.id} className="hover:bg-gray-50 cursor-pointer" onClick={()=>openEdit(d)}>
                                    <td className="px-4 py-3 font-medium">{d.title}</td>
                                    <td className="px-4 py-3 text-brand-600 font-semibold">${Number(d.value||0).toLocaleString()}</td>
                                    <td className="px-4 py-3 hidden sm:table-cell"><Badge stage={d.stage} /></td>
                                    <td className="px-4 py-3 hidden md:table-cell text-gray-500">{contacts.find(c=>c.id===d.contactId)?.name || '—'}</td>
                                    <td className="px-4 py-3">
                                        <button onClick={e=>{e.stopPropagation();deleteDeal(d.id)}} className="text-red-400 hover:text-red-600 text-xs">Delete</button>
                                    </td>
                                </tr>
                            ))}
                            </tbody>
                        </table>
                        {deals.length === 0 && <EmptyState icon="💼" text="No deals yet" />}
                    </div>
                )}

                <Modal open={!!modal} onClose={()=>setModal(null)} title={modal==='add' ? 'New Deal' : 'Edit Deal'}>
                    <Input label="Title" value={form.title||''} onChange={e=>setForm({...form,title:e.target.value})} />
                    <Input label="Value ($)" type="number" value={form.value||''} onChange={e=>setForm({...form,value:e.target.value})} />
                    <Select label="Stage" value={form.stage||'Lead'} options={stageOpts} onChange={e=>setForm({...form,stage:e.target.value})} />
                    <Select label="Contact" value={form.contactId||''} options={contactOpts} onChange={e=>setForm({...form,contactId:e.target.value})} />
                    <div className="flex justify-end gap-2 mt-4">
                        <Btn variant="secondary" onClick={()=>setModal(null)}>Cancel</Btn>
                        <Btn onClick={save}>Save</Btn>
                    </div>
                </Modal>
            </div>
        );
    }

    // Activities
    function Activities() {
        const { activities, contacts, addActivity, updateActivity, deleteActivity } = useCRM();
        const [modal, setModal] = useState(null);
        const [form, setForm] = useState({});
        const [filter, setFilter] = useState('all');

        const openAdd = () => { setForm({ type:'Call', description:'', contactId:'', date: new Date().toISOString().slice(0,10), done: false }); setModal('add'); };
        const openEdit = (a) => { setForm({...a}); setModal(a); };
        const save = () => {
            if (!form.description) return;
            if (modal === 'add') addActivity(form); else updateActivity(form.id, form);
            setModal(null);
        };

        const filtered = filter === 'all' ? activities : filter === 'open' ? activities.filter(a=>!a.done) : activities.filter(a=>a.done);
        const contactOpts = [{ value:'', label:'— None —' }, ...contacts.map(c => ({ value: c.id, label: c.name }))];
        const typeOpts = ['Call','Email','Meeting','Task','Follow-up'].map(t => ({ value: t, label: t }));

        return (
            <div className="fade-in">
                <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
                    <h1 className="text-2xl font-bold">Activities</h1>
                    <Btn onClick={openAdd}>+ Add Activity</Btn>
                </div>

                <div className="flex gap-2 mb-4">
                    {['all','open','done'].map(f => (
                        <Btn key={f} variant={filter===f?'primary':'secondary'} onClick={()=>setFilter(f)} className="capitalize">{f}</Btn>
                    ))}
                </div>

                {filtered.length === 0 ? <EmptyState icon="📋" text="No activities" /> : (
                    <div className="space-y-2">
                        {filtered.sort((a,b)=>a.date>b.date?-1:1).map(a => (
                            <div key={a.id} className="bg-white rounded-lg p-4 shadow-sm flex items-center gap-4 hover:shadow-md transition cursor-pointer" onClick={()=>openEdit(a)}>
                                <button onClick={e=>{e.stopPropagation(); updateActivity(a.id, { done: !a.done })}}
                                        className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 transition ${a.done ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-brand-500'}`}>
                                    {a.done && <span className="text-xs">✓</span>}
                                </button>
                                <div className="flex-1 min-w-0">
                                    <p className={`font-medium text-sm ${a.done ? 'line-through text-gray-400' : ''}`}>{a.description}</p>
                                    <p className="text-xs text-gray-400 mt-0.5">{a.type} · {a.date} {a.contactId ? `· ${contacts.find(c=>c.id===a.contactId)?.name||''}` : ''}</p>
                                </div>
                                <button onClick={e=>{e.stopPropagation(); deleteActivity(a.id)}} className="text-red-400 hover:text-red-600 text-xs flex-shrink-0">Delete</button>
                            </div>
                        ))}
                    </div>
                )}

                <Modal open={!!modal} onClose={()=>setModal(null)} title={modal==='add' ? 'New Activity' : 'Edit Activity'}>
                    <Input label="Description" value={form.description||''} onChange={e=>setForm({...form,description:e.target.value})} />
                    <Select label="Type" value={form.type||'Call'} options={typeOpts} onChange={e=>setForm({...form,type:e.target.value})} />
                    <Input label="Date" type="date" value={form.date||''} onChange={e=>setForm({...form,date:e.target.value})} />
                    <Select label="Contact" value={form.contactId||''} options={contactOpts} onChange={e=>setForm({...form,contactId:e.target.value})} />
                    <div className="flex justify-end gap-2 mt-4">
                        <Btn variant="secondary" onClick={()=>setModal(null)}>Cancel</Btn>
                        <Btn onClick={save}>Save</Btn>
                    </div>
                </Modal>
            </div>
        );
    }

    // Settings
    function Settings() {
        const resetData = () => { localStorage.removeItem(LS_KEY); window.location.reload(); };
        return (
            <div className="fade-in">
                <h1 className="text-2xl font-bold mb-6">Settings</h1>
                <div className="bg-white rounded-xl shadow-sm p-6 max-w-lg">
                    <h2 className="font-semibold mb-2">Data Management</h2>
                    <p className="text-sm text-gray-500 mb-4">All data is stored locally in your browser's localStorage.</p>
                    <Btn variant="danger" onClick={resetData}>Reset All Data</Btn>
                </div>
            </div>
        );
    }

    /* ─── App Shell ─── */
    const NAV = [
        { key: 'dashboard', label: 'Dashboard', icon: '📊' },
        { key: 'contacts', label: 'Contacts', icon: '👥' },
        { key: 'deals', label: 'Deals', icon: '💼' },
        { key: 'activities', label: 'Activities', icon: '📋' },
        { key: 'settings', label: 'Settings', icon: '⚙️' },
    ];

    function App() {
        const [page, setPage] = useState('dashboard');
        const [sidebarOpen, setSidebarOpen] = useState(false);

        const Page = { dashboard: Dashboard, contacts: Contacts, deals: Deals, activities: Activities, settings: Settings }[page];

        return (
            <CRMProvider>
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar overlay on mobile */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-30 lg:hidden" onClick={()=>setSidebarOpen(false)} />}

                    {/* Sidebar */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-60 bg-white border-r border-gray-200 flex flex-col transform transition-transform lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="px-5 py-5 border-b">
                            <h1 className="text-xl font-bold text-brand-600">ClearCRM</h1>
                            <p className="text-xs text-gray-400">Simple. Powerful.</p>
                        </div>
                        <nav className="flex-1 p-3 space-y-1">
                            {NAV.map(n => (
                                <button key={n.key} onClick={()=>{setPage(n.key);setSidebarOpen(false)}}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${page===n.key ? 'bg-brand-50 text-brand-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                                    <span>{n.icon}</span>{n.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 overflow-auto">
                        <header className="sticky top-0 bg-white/80 backdrop-blur border-b px-4 py-3 flex items-center gap-3 z-20 lg:px-6">
                            <button className="lg:hidden text-gray-500 hover:text-gray-700" onClick={()=>setSidebarOpen(true)}>
                                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                            </button>
                            <span className="text-sm text-gray-500 capitalize">{page}</span>
                        </header>
                        <div className="p-4 lg:p-8 max-w-7xl mx-auto">
                            <Page />
                        </div>
                    </main>
                </div>
            </CRMProvider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

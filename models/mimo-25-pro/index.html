<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="h-full">
<div id="root" class="h-full"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

const initialContacts = [
  { id: 1, name: "Alice Johnson", email: "alice@acme.com", phone: "555-0101", company: "Acme Corp", status: "Lead", notes: "Interested in enterprise plan" },
  { id: 2, name: "Bob Smith", email: "bob@globex.com", phone: "555-0102", company: "Globex Inc", status: "Customer", notes: "Active subscription" },
  { id: 3, name: "Carol White", email: "carol@initech.com", phone: "555-0103", company: "Initech", status: "Lead", notes: "Requested demo" },
  { id: 4, name: "Dave Brown", email: "dave@umbrella.com", phone: "555-0104", company: "Umbrella Co", status: "Customer", notes: "Renews in 3 months" },
  { id: 5, name: "Eve Davis", email: "eve@wayne.com", phone: "555-0105", company: "Wayne Enterprises", status: "Inactive", notes: "No response" },
];

const initialDeals = [
  { id: 1, title: "Acme Enterprise License", value: 48000, stage: "Proposal", contactId: 1 },
  { id: 2, title: "Globex Renewal", value: 12000, stage: "Closed Won", contactId: 2 },
  { id: 3, title: "Initech Pilot", value: 8500, stage: "Discovery", contactId: 3 },
  { id: 4, title: "Umbrella Expansion", value: 32000, stage: "Negotiation", contactId: 4 },
];

const STAGES = ["Discovery", "Proposal", "Negotiation", "Closed Won", "Closed Lost"];
const STATUSES = ["Lead", "Customer", "Inactive"];

const statusColors = {
  Lead: "bg-blue-100 text-blue-700",
  Customer: "bg-green-100 text-green-700",
  Inactive: "bg-gray-200 text-gray-600",
};

const stageColors = {
  Discovery: "bg-purple-100 text-purple-700",
  Proposal: "bg-blue-100 text-blue-700",
  Negotiation: "bg-yellow-100 text-yellow-700",
  "Closed Won": "bg-green-100 text-green-700",
  "Closed Lost": "bg-red-100 text-red-700",
};

function Badge({ children, colorClass }) {
  return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${colorClass}`}>{children}</span>;
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 p-6" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-semibold">{title}</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ContactsPage({ contacts, setContacts }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: "", email: "", phone: "", company: "", status: "Lead", notes: "" });

  const filtered = useMemo(() =>
    contacts.filter(c =>
      (filter === "All" || c.status === filter) &&
      (c.name.toLowerCase().includes(search.toLowerCase()) || c.email.toLowerCase().includes(search.toLowerCase()) || c.company.toLowerCase().includes(search.toLowerCase()))
    ), [contacts, search, filter]);

  const openNew = () => { setEditing(null); setForm({ name: "", email: "", phone: "", company: "", status: "Lead", notes: "" }); setModalOpen(true); };
  const openEdit = (c) => { setEditing(c); setForm({ name: c.name, email: c.email, phone: c.phone, company: c.company, status: c.status, notes: c.notes }); setModalOpen(true); };

  const save = () => {
    if (!form.name.trim()) return;
    if (editing) {
      setContacts(prev => prev.map(c => c.id === editing.id ? { ...c, ...form } : c));
    } else {
      setContacts(prev => [...prev, { id: Date.now(), ...form }]);
    }
    setModalOpen(false);
  };

  const remove = (id) => setContacts(prev => prev.filter(c => c.id !== id));

  return (
    <div>
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div className="flex gap-2">
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…" className="border rounded-lg px-3 py-2 text-sm w-64 focus:ring-2 focus:ring-indigo-500 outline-none" />
          <select value={filter} onChange={e => setFilter(e.target.value)} className="border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option>All</option>{STATUSES.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
        <button onClick={openNew} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ Add Contact</button>
      </div>
      <div className="bg-white rounded-xl shadow-sm overflow-hidden">
        <table className="w-full text-left text-sm">
          <thead className="bg-gray-50 text-gray-500 uppercase text-xs">
            <tr><th className="px-4 py-3">Name</th><th className="px-4 py-3">Email</th><th className="px-4 py-3">Company</th><th className="px-4 py-3">Status</th><th className="px-4 py-3">Phone</th><th className="px-4 py-3 text-right">Actions</th></tr>
          </thead>
          <tbody className="divide-y">
            {filtered.map(c => (
              <tr key={c.id} className="hover:bg-gray-50">
                <td className="px-4 py-3 font-medium">{c.name}</td>
                <td className="px-4 py-3 text-gray-600">{c.email}</td>
                <td className="px-4 py-3 text-gray-600">{c.company}</td>
                <td className="px-4 py-3"><Badge colorClass={statusColors[c.status]}>{c.status}</Badge></td>
                <td className="px-4 py-3 text-gray-600">{c.phone}</td>
                <td className="px-4 py-3 text-right space-x-2">
                  <button onClick={() => openEdit(c)} className="text-indigo-600 hover:underline text-xs">Edit</button>
                  <button onClick={() => remove(c.id)} className="text-red-500 hover:underline text-xs">Delete</button>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="6" className="px-4 py-10 text-center text-gray-400">No contacts found</td></tr>}
          </tbody>
        </table>
      </div>
      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? "Edit Contact" : "New Contact"}>
        <div className="grid grid-cols-2 gap-3">
          <input className="border rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1" placeholder="Full name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <input className="border rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1" placeholder="Email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
          <input className="border rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1" placeholder="Phone" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} />
          <input className="border rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1" placeholder="Company" value={form.company} onChange={e => setForm({ ...form, company: e.target.value })} />
          <select className="border rounded-lg px-3 py-2 text-sm col-span-2" value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
            {STATUSES.map(s => <option key={s}>{s}</option>)}
          </select>
          <textarea className="border rounded-lg px-3 py-2 text-sm col-span-2" rows="3" placeholder="Notes" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} />
        </div>
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={() => setModalOpen(false)} className="px-4 py-2 text-sm rounded-lg border hover:bg-gray-50">Cancel</button>
          <button onClick={save} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Save</button>
        </div>
      </Modal>
    </div>
  );
}

function DealsPage({ deals, setDeals, contacts }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ title: "", value: "", stage: "Discovery", contactId: "" });

  const openNew = () => { setEditing(null); setForm({ title: "", value: "", stage: "Discovery", contactId: "" }); setModalOpen(true); };
  const openEdit = (d) => { setEditing(d); setForm({ title: d.title, value: d.value, stage: d.stage, contactId: d.contactId }); setModalOpen(true); };

  const save = () => {
    if (!form.title.trim() || !form.value) return;
    const deal = { ...form, value: Number(form.value), contactId: Number(form.contactId) };
    if (editing) {
      setDeals(prev => prev.map(d => d.id === editing.id ? { ...d, ...deal } : d));
    } else {
      setDeals(prev => [...prev, { id: Date.now(), ...deal }]);
    }
    setModalOpen(false);
  };

  const remove = (id) => setDeals(prev => prev.filter(d => d.id !== id));

  const contactName = (id) => contacts.find(c => c.id === id)?.name || "—";

  return (
    <div>
      <div className="flex justify-between items-center mb-6">
        <p className="text-sm text-gray-500">Pipeline · {deals.length} deals · ${deals.reduce((s, d) => s + d.value, 0).toLocaleString()} total</p>
        <button onClick={openNew} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">+ Add Deal</button>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
        {STAGES.map(stage => {
          const stageDeals = deals.filter(d => d.stage === stage);
          return (
            <div key={stage} className="bg-gray-100 rounded-xl p-3">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-xs font-semibold uppercase text-gray-500">{stage}</h3>
                <span className="text-xs bg-white rounded-full px-2 py-0.5 text-gray-500">{stageDeals.length}</span>
              </div>
              <div className="space-y-2">
                {stageDeals.map(d => (
                  <div key={d.id} className="bg-white rounded-lg p-3 shadow-sm cursor-pointer hover:shadow-md transition" onClick={() => openEdit(d)}>
                    <p className="font-medium text-sm">{d.title}</p>
                    <p className="text-xs text-gray-500 mt-1">{contactName(d.contactId)}</p>
                    <p className="text-sm font-semibold text-indigo-600 mt-2">${d.value.toLocaleString()}</p>
                  </div>
                ))}
                {stageDeals.length === 0 && <p className="text-xs text-gray-400 text-center py-4">No deals</p>}
              </div>
            </div>
          );
        })}
      </div>
      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? "Edit Deal" : "New Deal"}>
        <div className="grid grid-cols-2 gap-3">
          <input className="border rounded-lg px-3 py-2 text-sm col-span-2" placeholder="Deal title" value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} />
          <input className="border rounded-lg px-3 py-2 text-sm" type="number" placeholder="Value ($)" value={form.value} onChange={e => setForm({ ...form, value: e.target.value })} />
          <select className="border rounded-lg px-3 py-2 text-sm" value={form.stage} onChange={e => setForm({ ...form, stage: e.target.value })}>
            {STAGES.map(s => <option key={s}>{s}</option>)}
          </select>
          <select className="border rounded-lg px-3 py-2 text-sm col-span-2" value={form.contactId} onChange={e => setForm({ ...form, contactId: e.target.value })}>
            <option value="">Select contact…</option>
            {contacts.map(c => <option key={c.id} value={c.id}>{c.name} — {c.company}</option>)}
          </select>
        </div>
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={() => setModalOpen(false)} className="px-4 py-2 text-sm rounded-lg border hover:bg-gray-50">Cancel</button>
          <button onClick={save} className="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Save</button>
        </div>
      </Modal>
    </div>
  );
}

function DashboardPage({ contacts, deals }) {
  const totalRevenue = deals.filter(d => d.stage === "Closed Won").reduce((s, d) => s + d.value, 0);
  const pipeline = deals.filter(d => !d.stage.startsWith("Closed")).reduce((s, d) => s + d.value, 0);
  const leads = contacts.filter(c => c.status === "Lead").length;
  const customers = contacts.filter(c => c.status === "Customer").length;

  const cards = [
    { label: "Total Revenue", value: `$${totalRevenue.toLocaleString()}`, color: "bg-green-50 border-green-200" },
    { label: "Pipeline Value", value: `$${pipeline.toLocaleString()}`, color: "bg-blue-50 border-blue-200" },
    { label: "Total Contacts", value: contacts.length, color: "bg-purple-50 border-purple-200" },
    { label: "Active Leads", value: leads, color: "bg-yellow-50 border-yellow-200" },
    { label: "Customers", value: customers, color: "bg-indigo-50 border-indigo-200" },
    { label: "Open Deals", value: deals.filter(d => !d.stage.startsWith("Closed")).length, color: "bg-rose-50 border-rose-200" },
  ];

  return (
    <div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
        {cards.map(c => (
          <div key={c.label} className={`rounded-xl border p-4 ${c.color}`}>
            <p className="text-xs text-gray-500 mb-1">{c.label}</p>
            <p className="text-2xl font-bold">{c.value}</p>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl shadow-sm p-5">
          <h3 className="text-sm font-semibold text-gray-700 mb-3">Deals by Stage</h3>
          {STAGES.map(stage => {
            const count = deals.filter(d => d.stage === stage).length;
            const pct = deals.length ? Math.round(count / deals.length * 100) : 0;
            return (
              <div key={stage} className="mb-2">
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-600">{stage}</span>
                  <span className="text-gray-400">{count} (${deals.filter(d => d.stage === stage).reduce((s, d) => s + d.value, 0).toLocaleString()})</span>
                </div>
                <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${pct}%` }} />
                </div>
              </div>
            );
          })}
        </div>
        <div className="bg-white rounded-xl shadow-sm p-5">
          <h3 className="text-sm font-semibold text-gray-700 mb-3">Recent Contacts</h3>
          <div className="space-y-3">
            {contacts.slice(-5).reverse().map(c => (
              <div key={c.id} className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold">{c.name[0]}</div>
                <div>
                  <p className="text-sm font-medium">{c.name}</p>
                  <p className="text-xs text-gray-400">{c.company}</p>
                </div>
                <Badge colorClass={statusColors[c.status]}>{c.status}</Badge>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [contacts, setContacts] = useState(initialContacts);
  const [deals, setDeals] = useState(initialDeals);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const nav = [
    { key: "dashboard", label: "Dashboard", icon: "📊" },
    { key: "contacts", label: "Contacts", icon: "👥" },
    { key: "deals", label: "Deals", icon: "💰" },
  ];

  return (
    <div className="flex h-full">
      {/* Mobile overlay */}
      {sidebarOpen && <div className="fixed inset-0 z-30 bg-black/40 lg:hidden" onClick={() => setSidebarOpen(false)} />}

      {/* Sidebar */}
      <aside className={`fixed inset-y-0 left-0 z-40 w-56 bg-gray-900 text-white flex flex-col transform transition-transform lg:relative lg:translate-x-0 ${sidebarOpen ? "translate-x-0" : "-translate-x-full"}`}>
        <div className="px-5 py-5 flex items-center gap-2">
          <div className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-sm">C</div>
          <span className="text-lg font-semibold tracking-tight">CRM Pro</span>
        </div>
        <nav className="flex-1 px-3 space-y-1">
          {nav.map(n => (
            <button key={n.key} onClick={() => { setPage(n.key); setSidebarOpen(false); }}
              className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition ${page === n.key ? "bg-white/10 text-white" : "text-gray-400 hover:text-white hover:bg-white/5"}`}>
              <span>{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div className="px-5 py-4 border-t border-white/10 text-xs text-gray-500">v1.0 · CRM Pro</div>
      </aside>

      {/* Main */}
      <div className="flex-1 flex flex-col min-w-0">
        <header className="flex items-center gap-3 bg-white border-b px-4 lg:px-8 py-3">
          <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-gray-500 text-xl">☰</button>
          <h1 className="text-lg font-semibold capitalize">{page}</h1>
        </header>
        <main className="flex-1 overflow-auto p-4 lg:p-8">
          {page === "dashboard" && <DashboardPage contacts={contacts} deals={deals} />}
          {page === "contacts" && <ContactsPage contacts={contacts} setContacts={setContacts} />}
          {page === "deals" && <DealsPage deals={deals} setDeals={setDeals} contacts={contacts} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            200: '#C7D2FE',
                            300: '#A5B4FC',
                            400: '#818CF8',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                            800: '#3730A3',
                            900: '#312E81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .animate-scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Utility functions
    const generateId = () => Math.random().toString(36).substr(2, 9);

    const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
    };

    const formatDate = (date) => {
        return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    };

    // Icons
    const Icons = {
        Dashboard: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />

        ),
        Users: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        ),
        Building: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
        ),
        Currency: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        ),
        Task: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
        ),
        Settings: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        ),
        Plus: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        ),
        Search: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        ),
        X: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        ),
        Check: () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
        ),
        ChevronRight: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        ),
        Calendar: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        ),
        TrendUp: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        ),
        TrendDown: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
        ),
        Mail: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        ),
        Phone: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
        ),
        Edit: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        ),
        Trash: () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        )
    };

    // Initial mock data
    const initialContacts = [
        { id: '1', name: 'Sarah Mitchell', email: 'sarah.mitchell@techcorp.com', phone: '+1 (555) 123-4567', company: 'TechCorp Industries', status: 'customer', createdAt: '2024-01-15' },
        { id: '2', name: 'James Rodriguez', email: 'j.rodriguez@startupxyz.io', phone: '+1 (555) 234-5678', company: 'StartupXYZ', status: 'lead', createdAt: '2024-02-20' },
        { id: '3', name: 'Emily Chen', email: 'emily.chen@globalfinance.com', phone: '+1 (555) 345-6789', company: 'Global Finance', status: 'customer', createdAt: '2024-01-08' },
        { id: '4', name: 'Michael Brown', email: 'm.brown@innovate.co', phone: '+1 (555) 456-7890', company: 'Innovate Co', status: 'lead', createdAt: '2024-03-01' },
        { id: '5', name: 'Lisa Thompson', email: 'lisa.t@dataflow.net', phone: '+1 (555) 567-8901', company: 'DataFlow Systems', status: 'churned', createdAt: '2023-11-10' },
    ];

    const initialCompanies = [
        { id: '1', name: 'TechCorp Industries', industry: 'Technology', website: 'techcorp.com', employees: '500-1000', revenue: '50M-100M' },
        { id: '2', name: 'StartupXYZ', industry: 'SaaS', website: 'startupxyz.io', employees: '50-100', revenue: '5M-10M' },
        { id: '3', name: 'Global Finance', industry: 'Financial Services', website: 'globalfinance.com', employees: '1000+', revenue: '100M+' },
        { id: '4', name: 'Innovate Co', industry: 'Consulting', website: 'innovate.co', employees: '100-500', revenue: '10M-50M' },
        { id: '5', name: 'DataFlow Systems', industry: 'Data Analytics', website: 'dataflow.net', employees: '50-100', revenue: '5M-10M' },
    ];

    const initialDeals = [
        { id: '1', title: 'Enterprise License', value: 45000, contact: 'Sarah Mitchell', company: 'TechCorp Industries', stage: 'won', probability: 100, expectedClose: '2024-03-15' },
        { id: '2', title: 'Annual Subscription', value: 15000, contact: 'James Rodriguez', company: 'StartupXYZ', stage: 'negotiation', probability: 75, expectedClose: '2024-04-01' },
        { id: '3', title: 'Pro Plan Upgrade', value: 8500, contact: 'Emily Chen', company: 'Global Finance', stage: 'proposal', probability: 50, expectedClose: '2024-04-15' },
        { id: '4', title: 'Starter Package', value: 5000, contact: 'Michael Brown', company: 'Innovate Co', stage: 'qualified', probability: 25, expectedClose: '2024-05-01' },
        { id: '5', title: 'Consulting Services', value: 25000, contact: 'Lisa Thompson', company: 'DataFlow Systems', stage: 'lost', probability: 0, expectedClose: '2024-02-28' },
    ];

    const initialTasks = [
        { id: '1', title: 'Follow up with Sarah about renewal', dueDate: '2024-04-10', priority: 'high', completed: false, relatedTo: 'Sarah Mitchell' },
        { id: '2', title: 'Send proposal to James', dueDate: '2024-04-08', priority: 'high', completed: false, relatedTo: 'James Rodriguez' },
        { id: '3', title: 'Schedule demo for TechCorp team', dueDate: '2024-04-12', priority: 'medium', completed: false, relatedTo: 'Sarah Mitchell' },
        { id: '4', title: 'Review contract terms', dueDate: '2024-04-05', priority: 'high', completed: true, relatedTo: 'Emily Chen' },
        { id: '5', title: 'Update CRM contact info', dueDate: '2024-04-15', priority: 'low', completed: false, relatedTo: 'General' },
    ];

    // Deal stages configuration
    const dealStages = [
        { id: 'lead', name: 'Lead', color: 'bg-slate-400' },
        { id: 'qualified', name: 'Qualified', color: 'bg-blue-500' },
        { id: 'proposal', name: 'Proposal', color: 'bg-purple-500' },
        { id: 'negotiation', name: 'Negotiation', color: 'bg-amber-500' },
        { id: 'won', name: 'Won', color: 'bg-emerald-500' },
        { id: 'lost', name: 'Lost', color: 'bg-red-500' },
    ];

    // Modal Component
    const Modal = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-50 overflow-y-auto">
                <div className="flex min-h-screen items-center justify-center p-4">
                    <div className="fixed inset-0 bg-black/50 transition-opacity" onClick={onClose}></div>
                    <div className="relative w-full max-w-lg bg-white rounded-xl shadow-2xl animate-scale-in">
                        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                            <h3 className="text-lg font-semibold text-slate-900">{title}</h3>
                            <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                        <div className="p-6">{children}</div>
                    </div>
                </div>
            </div>
        );
    };

    // Toast Component
    const Toast = ({ message, type, onClose }) => {
        useEffect(() => {
            const timer = setTimeout(onClose, 3000);
            return () => clearTimeout(timer);
        }, [onClose]);

        const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-slate-700';

        return (
            <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg animate-slide-up flex items-center gap-3 z-50`}>
                {type === 'success' && <Icons.Check />}
                <span>{message}</span>
            </div>
        );
    };

    // Form Input Component
    const FormInput = ({ label, ...props }) => (
        <div>
            <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>
            <input {...props} className="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all" />
        </div>
    );

    // Form Select Component
    const FormSelect = ({ label, options, ...props }) => (
        <div>
            <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>
            <select {...props} className="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all bg-white">
                {options.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
            </select>
        </div>
    );

    // Status Badge Component
    const StatusBadge = ({ status }) => {
        const styles = {
            lead: 'bg-amber-100 text-amber-700',
            customer: 'bg-emerald-100 text-emerald-700',
            churned: 'bg-slate-100 text-slate-600',
        };
        return <span className={`px-2.5 py-1 text-xs font-medium rounded-full ${styles[status]}`}>{status.charAt(0).toUpperCase() + status.slice(1)}</span>;
    };

    // Priority Badge Component
    const PriorityBadge = ({ priority }) => {
        const styles = {
            high: 'bg-red-100 text-red-700',
            medium: 'bg-amber-100 text-amber-700',
            low: 'bg-slate-100 text-slate-600',
        };
        return <span className={`px-2 py-0.5 text-xs font-medium rounded ${styles[priority]}`}>{priority}</span>;
    };

    // Metric Card Component
    const MetricCard = ({ icon: Icon, label, value, trend, trendValue }) => (
        <div className="bg-white rounded-xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
            <div className="flex items-start justify-between">
                <div className="p-2 bg-primary-50 rounded-lg text-primary-600">
                    <Icon />
                </div>
                {trend && (
                    <span className={`flex items-center text-sm font-medium ${trend === 'up' ? 'text-emerald-600' : 'text-red-600'}`}>
              {trend === 'up' ? <Icons.TrendUp /> : <Icons.TrendDown />}
                        {trendValue}
            </span>
                )}
            </div>
            <p className="mt-4 text-3xl font-bold text-slate-900">{value}</p>
            <p className="text-sm text-slate-500 mt-1">{label}</p>
        </div>
    );

    // Contact Form Modal
    const ContactForm = ({ contact, onSave, onClose }) => {
        const [formData, setFormData] = useState(contact || { name: '', email: '', phone: '', company: '', status: 'lead' });

        const handleSubmit = (e) => {
            e.preventDefault();
            onSave({ ...formData, id: contact?.id || generateId(), createdAt: contact?.createdAt || new Date().toISOString().split('T')[0] });
        };

        return (
            <form onSubmit={handleSubmit} className="space-y-4">
                <FormInput label="Name" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="John Smith" />
                <FormInput label="Email" type="email" required value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} placeholder="john@company.com" />
                <FormInput label="Phone" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} placeholder="+1 (555) 000-0000" />
                <FormInput label="Company" value={formData.company} onChange={e => setFormData({...formData, company: e.target.value})} placeholder="Company Name" />
                <FormSelect label="Status" value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}
                            options={[{value: 'lead', label: 'Lead'}, {value: 'customer', label: 'Customer'}, {value: 'churned', label: 'Churned'}]} />
                <div className="flex gap-3 pt-4">
                    <button type="button" onClick={onClose} className="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" className="flex-1 px-4 py-2.5 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">Save Contact</button>
                </div>
            </form>
        );
    };

    // Company Form Modal
    const CompanyForm = ({ company, onSave, onClose }) => {
        const [formData, setFormData] = useState(company || { name: '', industry: '', website: '', employees: '', revenue: '' });

        const handleSubmit = (e) => {
            e.preventDefault();
            onSave({ ...formData, id: company?.id || generateId() });
        };

        return (
            <form onSubmit={handleSubmit} className="space-y-4">
                <FormInput label="Company Name" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="Acme Inc" />
                <FormSelect label="Industry" value={formData.industry} onChange={e => setFormData({...formData, industry: e.target.value})}
                            options={[{value: 'Technology', label: 'Technology'}, {value: 'SaaS', label: 'SaaS'}, {value: 'Financial Services', label: 'Financial Services'}, {value: 'Healthcare', label: 'Healthcare'}, {value: 'Consulting', label: 'Consulting'}, {value: 'Retail', label: 'Retail'}]} />
                <FormInput label="Website" value={formData.website} onChange={e => setFormData({...formData, website: e.target.value})} placeholder="acme.com" />
                <FormSelect label="Employees" value={formData.employees} onChange={e => setFormData({...formData, employees: e.target.value})}
                            options={[{value: '1-10', label: '1-10'}, {value: '10-50', label: '10-50'}, {value: '50-100', label: '50-100'}, {value: '100-500', label: '100-500'}, {value: '500-1000', label: '500-1000'}, {value: '1000+', label: '1000+'}]} />
                <FormSelect label="Annual Revenue" value={formData.revenue} onChange={e => setFormData({...formData, revenue: e.target.value})}
                            options={[{value: '<1M', label: 'Under $1M'}, {value: '1M-5M', label: '$1M - $5M'}, {value: '5M-10M', label: '$5M - $10M'}, {value: '10M-50M', label: '$10M - $50M'}, {value: '50M-100M', label: '$50M - $100M'}, {value: '100M+', label: '$100M+'}]} />
                <div className="flex gap-3 pt-4">
                    <button type="button" onClick={onClose} className="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-700 hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" className="flex-1 px-4 py-2.5 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">Save Company</button>
                </div>
            </form>
        );
    };

    // Deal Form Modal
    const DealForm = ({ deal, contacts, onSave, onClose }) => {
        const [formData, setFormData] = useState(deal || { title: '', value: '', contact: '', company: '', stage: 'lead', probability: 10, expectedClose: '' });

        const handleSubmit = (e) => {
            e.preventDefault();
            onSave({ ...formData, id: deal?.id || generateId() });
        };

        return (
            <form onSubmit={handleSubmit} className="space-y-4">
                <FormInput label="Deal Title" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="Enterprise License" />
                <FormInput label="Value ($)" type="number" required value={formData.value} onChange={e => setFormData({...formData, value: parseInt(e.target.value)})} placeholder="50000" />
                <FormSelect label="Contact" value={formData.contact} onChange={e => setFormData({...formData, contact: e.target.value})}

                console.log("Toggle iframe highlight to:", _enabled);
                if (_enabled) {
                    enableHighlight();
                } else {
                    disableHighlight();
                }
            } else if (event.data.type === "update-selected-element") {
                var selector = event.data.selector;
                console.log("Update selected element with selector:", selector);
                if (selector) {
                    try {
                        var element = document.querySelector(selector);
                        console.log("Found element by selector:", element);
                        updateSelectedHighlight(element);
                    } catch (error) {
                        console.warn("Failed to select element:", error);
                        updateSelectedHighlight(null);
                    }
                } else {
                    updateSelectedHighlight(null);
                }
            } else if (event.data.type === "clear-selected-element") {
                console.log("Clear selected element");
                updateSelectedHighlight(null);
            }
        }

        // 启用高亮功能
        function enableHighlight() {
            console.log("Enabling highlight");
            document.addEventListener("mouseover", handleMouseOver, true);
            document.addEventListener("mouseout", handleMouseOut, true);
            document.addEventListener("click", handleClick, true);
            highlightEnabled = true;
            overlay.style.display = "block";
        }

        // 禁用高亮功能
        function disableHighlight() {
            console.log("Disabling highlight");
            highlightEnabled = false;
            // 保持事件监听器，但通过 highlightEnabled 变量控制行为
            // 这样可以保留选中状态的显示
            highlightBox.style.display = "none";
            tagLabel.style.display = "none";
            // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
        }

        // 完全禁用高亮功能（移除所有监听器）
        function fullyDisableHighlight() {
            console.log("Fully disabling highlight");
            highlightEnabled = false;
            document.removeEventListener("mouseover", handleMouseOver, true);
            document.removeEventListener("mouseout", handleMouseOut, true);
            document.removeEventListener("click", handleClick, true);
            overlay.style.display = "none";
            highlightBox.style.display = "none";
            tagLabel.style.display = "none";
            selectedBox.style.display = "none";
            selectedLabel.style.display = "none";
        }

        // 添加事件监听
        enableHighlight();
        window.addEventListener("message", handleParentMessage);

        // 暴露全局函数供外部调用
        window.__iframeHighlightControl = {
            enable: enableHighlight,
            disable: disableHighlight,
            fullyDisable: fullyDisableHighlight,
            isEnabled: function isEnabled() {
                return highlightEnabled;
            },
            getSelectedElement: function getSelectedElement() {
                return selectedElement;
            },
            updateSelected: updateSelectedHighlight,
            // 通过消息发送开关控制
            sendToggleMessage: function sendToggleMessage(enabled) {
                window.parent.postMessage({
                    type: 'iframe-highlight-status',
                    enabled: enabled || highlightEnabled,
                    source: 'iframe-highlight-injector'
                }, '*');
            }
        };

        // 通知父窗口脚本已加载
        try {
            window.parent.postMessage({
                type: "iframe-highlight-ready",
                data: {
                    url: window.location.href,
                    userAgent: navigator.userAgent,
                    timestamp: Date.now()
                },
                source: "iframe-highlight-injector"
            }, "*");
        } catch (error) {
            console.warn("无法发送就绪消息到父窗口:", error);
        }

        // 清理函数
        window.__iframeHighlightCleanup = function () {
            fullyDisableHighlight();
            window.removeEventListener("message", handleParentMessage);
            if (overlay.parentElement) {
                overlay.parentElement.removeChild(overlay);
            }
            delete window.__iframeHighlightInitialized;
            delete window.__iframeHighlightCleanup;
        };
    })();

</script>
</body>

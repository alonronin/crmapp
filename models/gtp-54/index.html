<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseCRM - Basic SaaS CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    },
                    boxShadow: {
                        soft: '0 10px 30px rgba(2, 6, 23, 0.08)'
                    }
                }
            }
        };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
<div id="root"></div>

<script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const STORAGE_KEY = 'pulsecrm-spa-v1';

    const seedData = {
        contacts: [
            {
                id: 1,
                name: 'Maya Cohen',
                company: 'BluePeak Labs',
                email: 'maya@bluepeak.io',
                phone: '+972 54-123-4567',
                status: 'Active',
                owner: 'Daniel'
            },
            {
                id: 2,
                name: 'Noam Levi',
                company: 'Northwind Health',
                email: 'noam@northwind.health',
                phone: '+972 52-987-6543',
                status: 'Lead',
                owner: 'Ariel'
            },
            {
                id: 3,
                name: 'Sophie Green',
                company: 'Vertex Commerce',
                email: 'sophie@vertexcommerce.com',
                phone: '+1 415 555 0193',
                status: 'Customer',
                owner: 'Daniel'
            }
        ],
        deals: [
            {
                id: 101,
                title: 'BluePeak Annual Plan',
                company: 'BluePeak Labs',
                value: 18000,
                owner: 'Daniel',
                stage: 'Qualified',
                closeDate: '2026-04-30'
            },
            {
                id: 102,
                title: 'Northwind Pilot',
                company: 'Northwind Health',
                value: 7500,
                owner: 'Ariel',
                stage: 'Proposal',
                closeDate: '2026-04-18'
            },
            {
                id: 103,
                title: 'Vertex Expansion',
                company: 'Vertex Commerce',
                value: 26000,
                owner: 'Daniel',
                stage: 'Won',
                closeDate: '2026-03-28'
            },
            {
                id: 104,
                title: 'Nimbus Renewal',
                company: 'Nimbus Cloud',
                value: 12000,
                owner: 'Lior',
                stage: 'New',
                closeDate: '2026-05-10'
            }
        ],
        tasks: [
            {
                id: 201,
                title: 'Follow up with Maya',
                relatedTo: 'BluePeak Labs',
                dueDate: '2026-04-07',
                priority: 'High',
                completed: false
            },
            {
                id: 202,
                title: 'Send proposal to Northwind',
                relatedTo: 'Northwind Health',
                dueDate: '2026-04-08',
                priority: 'High',
                completed: false
            },
            {
                id: 203,
                title: 'Prepare renewal summary',
                relatedTo: 'Nimbus Cloud',
                dueDate: '2026-04-11',
                priority: 'Medium',
                completed: true
            }
        ],
        activity: [
            {
                id: 301,
                text: 'Vertex Expansion marked as Won',
                time: '2026-04-06 09:15'
            },
            {
                id: 302,
                text: 'New contact added: Maya Cohen',
                time: '2026-04-06 08:42'
            },
            {
                id: 303,
                text: 'Task completed: Prepare renewal summary',
                time: '2026-04-05 17:20'
            }
        ]
    };

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : seedData;
        } catch {
            return seedData;
        }
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-IL', {
            style: 'currency',
            currency: 'ILS',
            maximumFractionDigits: 0
        }).format(value);
    }

    function formatDate(dateString) {
        if (!dateString) return '-';
        return new Intl.DateTimeFormat('en-IL', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        }).format(new Date(dateString));
    }

    function nowStamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return [
            d.getFullYear(),
            pad(d.getMonth() + 1),
            pad(d.getDate())
        ].join('-') + ' ' + [pad(d.getHours()), pad(d.getMinutes())].join(':');
    }

    function classNames(...classes) {
        return classes.filter(Boolean).join(' ');
    }

    function App() {
        const [data, setData] = useState(loadData());
        const [view, setView] = useState('dashboard');
        const [search, setSearch] = useState('');

        useEffect(() => {
            saveData(data);
        }, [data]);

        const filteredContacts = useMemo(() => {
            const q = search.trim().toLowerCase();
            if (!q) return data.contacts;
            return data.contacts.filter((contact) =>
                [contact.name, contact.company, contact.email, contact.owner, contact.status]
                    .join(' ')
                    .toLowerCase()
                    .includes(q)
            );
        }, [search, data.contacts]);

        const filteredDeals = useMemo(() => {
            const q = search.trim().toLowerCase();
            if (!q) return data.deals;
            return data.deals.filter((deal) =>
                [deal.title, deal.company, deal.owner, deal.stage]
                    .join(' ')
                    .toLowerCase()
                    .includes(q)
            );
        }, [search, data.deals]);

        const filteredTasks = useMemo(() => {
            const q = search.trim().toLowerCase();
            if (!q) return data.tasks;
            return data.tasks;
            return data.tasks.filter((task) =>
                [task.title, task.relatedTo, task.priority]
                    .join(' ')
                    .toLowerCase()
                    .includes(q)
            );
        }, [search, data.tasks]);

        const metrics = useMemo(() => {
            const totalPipeline = data.deals
                .filter((d) => d.stage !== 'Lost' && d.stage !== 'Won')
                .reduce((sum, d) => sum + Number(d.value || 0), 0);

            const wonRevenue = data.deals
                .filter((d) => d.stage === 'Won')
                .reduce((sum, d) => sum + Number(d.value || 0), 0);

            const openTasks = data.tasks.filter((t) => !t.completed).length;
            const customerCount = data.contacts.filter((c) => c.status === 'Customer').length;

            return { totalPipeline, wonRevenue, openTasks, customerCount };
        }, [data]);

        function addActivity(text) {
            setData((prev) => ({
                ...prev,
                activity: [
                    {
                        id: Date.now() + Math.floor(Math.random() * 1000),
                        text,
                        time: nowStamp()
                    },
                    ...prev.activity
                ].slice(0, 12)
            }));
        }

        function updateData(updater, activityText) {
            setData((prev) => {
                const next = updater(prev);
                return next;
            });
            if (activityText) addActivity(activityText);
        }

        function addContact(contact) {
            updateData(
                (prev) => ({
                    ...prev,
                    contacts: [
                        {
                            ...contact,
                            id: Date.now()
                        },
                        ...prev.contacts
                    ]
                }),
                `New contact added: ${contact.name}`
            );
        }

        function addDeal(deal) {
            updateData(
                (prev) => ({
                    ...prev,
                    deals: [
                        {
                            ...deal,
                            id: Date.now()
                        },
                        ...prev.deals
                    ]
                }),
                `Deal created: ${deal.title}`
            );
        }

        function addTask(task) {
            updateData(
                (prev) => ({
                    ...prev,
                    tasks: [
                        {
                            ...task,
                            id: Date.now()
                        },
                        ...prev.tasks
                    ]
                }),
                `Task created: ${task.title}`
            );
        }

        function toggleTask(taskId) {
            const task = data.tasks.find((t) => t.id === taskId);
            updateData(
                (prev) => ({
                    ...prev,
                    tasks: prev.tasks.map((t) =>
                        t.id === taskId ? { ...t, completed: !t.completed } : t
                    )
                }),
                task
                    ? `${task.completed ? 'Task reopened' : 'Task completed'}: ${task.title}`
                    : null
            );
        }

        function updateDealStage(dealId, stage) {
            const deal = data.deals.find((d) => d.id === dealId);
            updateData(
                (prev) => ({
                    ...prev,
                    deals: prev.deals.map((d) =>
                        d.id === dealId ? { ...d, stage } : d
                    )
                }),
                deal ? `${deal.title} moved to ${stage}` : null
            );
        }

        const navItems = [
            { id: 'dashboard', label: 'Dashboard', icon: '▣' },
            { id: 'contacts', label: 'Contacts', icon: '◉' },
            { id: 'deals', label: 'Deals', icon: '◆' },
            { id: 'tasks', label: 'Tasks', icon: '✓' }
        ];

        return (
            <div className="min-h-screen">
                <div className="flex min-h-screen">
                    <aside className="hidden w-72 flex-col border-r border-slate-200 bg-white lg:flex">
                        <div className="border-b border-slate-200 px-6 py-6">
                            <div className="flex items-center gap-3">
                                <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-600 text-lg font-bold text-white shadow-soft">
                                    P
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-slate-900">
                                        PulseCRM
                                    </h1>
                                    <p className="text-sm text-slate-500">
                                        Sales, contacts, tasks
                                    </p>
                                </div>
                            </div>
                        </div>

                        <nav className="flex-1 px-4 py-6">
                            <ul className="space-y-2">
                                {navItems.map((item) => (
                                    <li key={item.id}>
                                        <button
                                            onClick={() => setView(item.id)}
                                            className={classNames(
                                                'flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm font-medium transition',
                                                view === item.id
                                                    ? 'bg-brand-50 text-brand-700'
                                                    : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                                            )}
                                        >
                                            <span className="text-base">{item.icon}</span>
                                            <span>{item.label}</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>

                        <div className="border-t border-slate-200 p-4">
                            <div className="rounded-2xl bg-slate-900 p-4 text-white shadow-soft">
                                <p className="text-sm text-slate-300">Current pipeline</p>
                                <p className="mt-1 text-2xl font-semibold">
                                    {formatCurrency(metrics.totalPipeline)}
                                </p>
                                <p className="mt-2 text-xs text-slate-400">
                                    Open deal value across your workspace
                                </p>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1">
                        <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
                            <div className="flex flex-col gap-4 px-4 py-4 sm:px-6 lg:px-8">
                                <div className="flex flex-col justify-between gap-4 md:flex-row md:items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold tracking-tight text-slate-900">
                                            Basic CRM Workspace
                                        </h2>
                                        <p className="text-sm text-slate-500">
                                            Manage contacts, track deals, and keep work moving.
                                        </p>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-3">
                                        <input
                                            value={search}
                                            onChange={(e) => setSearch(e.target.value)}
                                            placeholder="Search contacts, deals, tasks..."
                                            className="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none ring-0 transition placeholder:text-slate-400 focus:border-brand-500 md:w-80"
                                        />
                                        <div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-600">
                                            Team: 3 reps
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3 lg:hidden">
                                    {navItems.map((item) => (
                                        <button
                                            key={item.id}
                                            onClick={() => setView(item.id)}
                                            className={classNames(
                                                'rounded-xl px-4 py-3 text-sm font-medium transition',
                                                view === item.id
                                                    ? 'bg-brand-600 text-white'
                                                    : 'bg-white text-slate-600 border border-slate-200'
                                            )}
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </header>

                        <div className="px-4 py-6 sm:px-6 lg:px-8">
                            {view === 'dashboard' && (
                                <DashboardView
                                    data={data}
                                    metrics={metrics}
                                    onSetView={setView}
                                />
                            )}

                            {view === 'contacts' && (
                                <ContactsView
                                    contacts={filteredContacts}
                                    onAddContact={addContact}
                                />
                            )}

                            {view === 'deals' && (
                                <DealsView
                                    deals={filteredDeals}
                                    onAddDeal={addDeal}
                                    onUpdateDealStage={updateDealStage}
                                />
                            )}

                            {view === 'tasks' && (
                                <TasksView
                                    tasks={filteredTasks}
                                    onAddTask={addTask}
                                    onToggleTask={toggleTask}
                                />
                            )}
                        </div>
                    </main>
                </div>
            </div>
        );
    }

    function DashboardView({ data, metrics, onSetView }) {
        const stages = ['New', 'Qualified', 'Proposal', 'Won', 'Lost'];

        const stageCounts = stages.map((stage) => ({
            stage,
            count: data.deals.filter((d) => d.stage === stage).length
        }));

        const upcomingTasks = [...data.tasks]
            .filter((t) => !t.completed)
            .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
            .slice(0, 5);

        const recentContacts = data.contacts.slice(0, 5);

        return (
            <div className="space-y-6">
                <section className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                    <MetricCard
                        title="Open Pipeline"
                        value={formatCurrency(metrics.totalPipeline)}
                        hint="Value of active deals"
                        color="indigo"
                    />
                    <MetricCard
                        title="Won Revenue"
                        value={formatCurrency(metrics.wonRevenue)}
                        hint="Closed won deals"
                        color="emerald"
                    />
                    <MetricCard
                        title="Open Tasks"
                        value={String(metrics.openTasks)}
                        hint="Items requiring action"
                        color="amber"
                    />
                    <MetricCard
                        title="Customers"
                        value={String(metrics.customerCount)}
                        hint="Contacts marked as customers"
                        color="sky"
                    />
                </section>

                <section className="grid gap-6 xl:grid-cols-3">
                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft xl:col-span-2">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Deal stages
                                </h3>
                                <p className="text-sm text-slate-500">
                                    Quick view of your funnel distribution
                                </p>
                            </div>
                            <button
                                onClick={() => onSetView('deals')}
                                className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-800"
                            >
                                Open deals
                            </button>
                        </div>

                        <div className="grid gap-4 md:grid-cols-5">
                            {stageCounts.map((item) => (
                                <div
                                    key={item.stage}
                                    className="rounded-2xl border border-slate-200 bg-slate-50 p-4"
                                >
                                    <p className="text-xs font-medium uppercase tracking-wide text-slate-500">
                                        {item.stage}
                                    </p>
                                    <p className="mt-3 text-3xl font-bold text-slate-900">
                                        {item.count}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Activity
                                </h3>
                                <p className="text-sm text-slate-500">
                                    Latest workspace updates
                                </p>
                            </div>
                        </div>

                        <div className="space-y-4">
                            {data.activity.slice(0, 8).map((item) => (
                                <div key={item.id} className="flex gap-3">
                                    <div className="mt-1 h-2.5 w-2.5 rounded-full bg-brand-500"></div>
                                    <div>
                                        <p className="text-sm font-medium text-slate-800">
                                            {item.text}
                                        </p>
                                        <p className="text-xs text-slate-500">
                                            {item.time}
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>

                <section className="grid gap-6 xl:grid-cols-2">
                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Upcoming tasks
                                </h3>
                                <p className="text-sm text-slate-500">
                                    Your next follow-ups and deliverables
                                </p>
                            </div>
                            <button
                                onClick={() => onSetView('tasks')}
                                className="text-sm font-medium text-brand-700 hover:text-brand-600"
                            >
                                View all
                            </button>
                        </div>

                        <div className="space-y-3">
                            {upcomingTasks.length === 0 && (
                                <p className="text-sm text-slate-500">No open tasks.</p>
                            )}

                            {upcomingTasks.map((task) => (
                                <div
                                    key={task.id}
                                    className="flex items-center justify-between rounded-2xl border border-slate-200 p-4"
                                >
                                    <div>
                                        <p className="font-medium text-slate-900">
                                            {task.title}
                                        </p>
                                        <p className="text-sm text-slate-500">
                                            {task.relatedTo}
                                        </p>
                                    </div>
                                    <div className="text-right">
                                        <PriorityBadge priority={task.priority} />
                                        <p className="mt-2 text-xs text-slate-500">
                                            Due {formatDate(task.dueDate)}
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Recent contacts
                                </h3>
                                <p className="text-sm text-slate-500">
                                    New and active relationship records
                                </p>
                            </div>
                            <button
                                onClick={() => onSetView('contacts')}
                                className="text-sm font-medium text-brand-700 hover:text-brand-600"
                            >
                                View all
                            </button>
                        </div>

                        <div className="space-y-3">
                            {recentContacts.map((contact) => (
                                <div
                                    key={contact.id}
                                    className="flex items-center justify-between rounded-2xl border border-slate-200 p-4"
                                >
                                    <div>
                                        <p className="font-medium text-slate-900">
                                            {contact.name}
                                        </p>
                                        <p className="text-sm text-slate-500">
                                            {contact.company}
                                        </p>
                                    </div>
                                    <div className="text-right">
                                        <StatusBadge status={contact.status} />
                                        <p className="mt-2 text-xs text-slate-500">
                                            Owner: {contact.owner}
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            </div>
        );
    }

    function ContactsView({ contacts, onAddContact }) {
        const [form, setForm] = useState({
            name: '',
            company: '',
            email: '',
            phone: '',
            status: 'Lead',
            owner: 'Daniel'
        });

        function submit(e) {
            e.preventDefault();
            if (!form.name.trim() || !form.company.trim() || !form.email.trim()) return;
            onAddContact({
                ...form,
                name: form.name.trim(),
                company: form.company.trim(),
                email: form.email.trim()
            });
            setForm({
                name: '',
                company: '',
                email: '',
                phone: '',
                status: 'Lead',
                owner: 'Daniel'
            });
        }

        return (
            <div className="grid gap-6 xl:grid-cols-[380px,1fr]">
                <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-900">Add contact</h3>
                    <p className="mt-1 text-sm text-slate-500">
                        Create a new lead, active contact, or customer record.
                    </p>

                    <form onSubmit={submit} className="mt-6 space-y-4">
                        <Input
                            label="Full name"
                            value={form.name}
                            onChange={(value) => setForm({ ...form, name: value })}
                            placeholder="e.g. Dana Shamir"
                        />
                        <Input
                            label="Company"
                            value={form.company}
                            onChange={(value) => setForm({ ...form, company: value })}
                            placeholder="e.g. Horizon Systems"
                        />
                        <Input
                            label="Email"
                            type="email"
                            value={form.email}
                            onChange={(value) => setForm({ ...form, email: value })}
                            placeholder="name@company.com"
                        />
                        <Input
                            label="Phone"
                            value={form.phone}
                            onChange={(value) => setForm({ ...form, phone: value })}
                            placeholder="+972 50-000-0000"
                        />

                        <div className="grid gap-4 sm:grid-cols-2">
                            <Select
                                label="Status"
                                value={form.status}
                                onChange={(value) => setForm({ ...form, status: value })}
                                options={['Lead', 'Active', 'Customer']}
                            />
                            <Select
                                label="Owner"
                                value={form.owner}
                                onChange={(value) => setForm({ ...form, owner: value })}
                                options={['Daniel', 'Ariel', 'Lior']}
                            />
                        </div>

                        <button
                            type="submit"
                            className="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-700"
                        >
                            Save contact
                        </button>
                    </form>
                </section>

                <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                    <div className="mb-5 flex items-center justify-between">
                        <div>
                            <h3 className="text-lg font-semibold text-slate-900">
                                Contacts
                            </h3>
                            <p className="text-sm text-slate-500">
                                {contacts.length} contact{contacts.length !== 1 ? 's' : ''} found
                            </p>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="min-w-full text-left">
                            <thead>
                            <tr className="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                                <th className="px-4 py-3 font-medium">Name</th>
                                <th className="px-4 py-3 font-medium">Company</th>
                                <th className="px-4 py-3 font-medium">Email</th>
                                <th className="px-4 py-3 font-medium">Phone</th>
                                <th className="px-4 py-3 font-medium">Status</th>
                                <th className="px-4 py-3 font-medium">Owner</th>
                            </tr>
                            </thead>
                            <tbody>
                            {contacts.map((contact) => (
                                <tr
                                    key={contact.id}
                                    className="border-b border-slate-100 last:border-0 hover:bg-slate-50"
                                >
                                    <td className="px-4 py-4">
                                        <div className="font-medium text-slate-900">
                                            {contact.name}
                                        </div>
                                    </td>
                                    <td className="px-4 py-4 text-sm text-slate-600">
                                        {contact.company}
                                    </td>
                                    <td className="px-4 py-4 text-sm text-slate-600">
                                        {contact.email}
                                    </td>
                                    <td className="px-4 py-4 text-sm text-slate-600">
                                        {contact.phone || '-'}
                                    </td>
                                    <td className="px-4 py-4">
                                        <StatusBadge status={contact.status} />
                                    </td>
                                    <td className="px-4 py-4 text-sm text-slate-600">
                                        {contact.owner}
                                    </td>
                                </tr>
                            ))}
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        );
    }

    function DealsView({ deals, onAddDeal, onUpdateDealStage }) {
        const [form, setForm] = useState({
            title: '',
            company: '',
            value: '',
            owner: 'Daniel',
            stage: 'New',
            closeDate: ''
        });

        const stages = ['New', 'Qualified', 'Proposal', 'Won', 'Lost'];

        function submit(e) {
            e.preventDefault();
            if (!form.title.trim() || !form.company.trim() || !form.value) return;
            onAddDeal({
                ...form,
                title: form.title.trim(),
                company: form.company.trim(),
                value: Number(form.value)
            });
            setForm({
                title: '',
                company: '',
                value: '',
                owner: 'Daniel',
                stage: 'New',
                closeDate: ''
            });
        }

        return (
            <div className="space-y-6">
                <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-900">Create deal</h3>
                    <p className="mt-1 text-sm text-slate-500">
                        Add a new opportunity to the pipeline.
                    </p>

                    <form onSubmit={submit} className="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-6">
                        <div className="xl:col-span-2">
                            <Input
                                label="Deal title"
                                value={form.title}
                                onChange={(value) => setForm({ ...form, title: value })}
                                placeholder="e.g. Annual Enterprise Plan"
                            />
                        </div>
                        <div>
                            <Input
                                label="Company"
                                value={form.company}
                                onChange={(value) => setForm({ ...form, company: value })}
                                placeholder="Company"
                            />
                        </div>
                        <div>
                            <Input
                                label="Value (₪)"
                                type="number"
                                value={form.value}
                                onChange={(value) => setForm({ ...form, value })}
                                placeholder="10000"
                            />
                        </div>
                        <div>
                            <Select
                                label="Owner"
                                value={form.owner}
                                onChange={(value) => setForm({ ...form, owner: value })}
                                options={['Daniel', 'Ariel', 'Lior']}
                            />
                        </div>
                        <div>
                            <Select
                                label="Stage"
                                value={form.stage}
                                onChange={(value) => setForm({ ...form, stage: value })}
                                options={stages}
                            />
                        </div>
                        <div>
                            <Input
                                label="Close date"
                                type="date"
                                value={form.closeDate}
                                onChange={(value) => setForm({ ...form, closeDate: value })}
                            />
                        </div>

                        <div className="md:col-span-2 xl:col-span-6">
                            <button
                                type="submit"
                                className="rounded-xl bg-brand-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-brand-700"
                            >
                                Add deal
                            </button>
                        </div>
                    </form>
                </section>

                <section className="grid gap-4 xl:grid-cols-5">
                    {stages.map((stage) => {
                        const stageDeals = deals.filter((deal) => deal.stage === stage);

                        return (
                            <div
                                key={stage}
                                className="rounded-3xl border border-slate-200 bg-white p-4 shadow-soft"
                            >
                                <div className="mb-4 flex items-center justify-between">
                                    <div>
                                        <h3 className="font-semibold text-slate-900">{stage}</h3>
                                        <p className="text-xs text-slate-500">
                                            {stageDeals.length} deal{stageDeals.length !== 1 ? 's' : ''}
                                        </p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {stageDeals.map((deal) => (
                                        <div
                                            key={deal.id}
                                            className="rounded-2xl border border-slate-200 bg-slate-50 p-4"
                                        >
                                            <div className="flex items-start justify-between gap-3">
                                                <div>
                                                    <h4 className="font-medium text-slate-900">
                                                        {deal.title}
                                                    </h4>
                                                    <p className="text-sm text-slate-500">
                                                        {deal.company}
                                                    </p>
                                                </div>
                                                <span className="rounded-full bg-slate-900 px-2.5 py-1 text-xs font-semibold text-white">
                                                        {formatCurrency(deal.value)}
                                                    </span>
                                            </div>

                                            <div className="mt-4 space-y-2 text-xs text-slate-500">
                                                <p>Owner: {deal.owner}</p>
                                                <p>Close: {formatDate(deal.closeDate)}</p>
                                            </div>

                                            <div className="mt-4">
                                                <label className="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">
                                                    Move stage
                                                </label>
                                                <select
                                                    value={deal.stage}
                                                    onChange={(e) => onUpdateDealStage(deal.id, e.target.value)}
                                                    className="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-brand-500"
                                                >
                                                    {stages.map((option) => (
                                                        <option key={option} value={option}>
                                                            {option}
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                    ))}

                                    {stageDeals.length === 0 && (
                                        <div className="rounded-2xl border border-dashed border-slate-300 p-5 text-center text-sm text-slate-400">
                                            No deals
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </section>
            </div>
        );
    }

    function TasksView({ tasks, onAddTask, onToggleTask }) {
        const [form, setForm] = useState({
            title: '',
            relatedTo: '',
            dueDate: '',
            priority: 'Medium',
            completed: false
        });

        const openTasks = tasks.filter((task) => !task.completed);
        const completedTasks = tasks.filter((task) => task.completed);

        function submit(e) {
            e.preventDefault();
            if (!form.title.trim()) return;
            onAddTask({
                ...form,
                title: form.title.trim(),
                relatedTo: form.relatedTo.trim()
            });
            setForm({
                title: '',
                relatedTo: '',
                dueDate: '',
                priority: 'Medium',
                completed: false
            });
        }

        return (
            <div className="grid gap-6 xl:grid-cols-[380px,1fr]">
                <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                    <h3 className="text-lg font-semibold text-slate-900">Create task</h3>
                    <p className="mt-1 text-sm text-slate-500">
                        Add a follow-up, reminder, or internal action item.
                    </p>

                    <form onSubmit={submit} className="mt-6 space-y-4">
                        <Input
                            label="Task title"
                            value={form.title}
                            onChange={(value) => setForm({ ...form, title: value })}
                            placeholder="e.g. Schedule product demo"
                        />
                        <Input
                            label="Related to"
                            value={form.relatedTo}
                            onChange={(value) => setForm({ ...form, relatedTo: value })}
                            placeholder="Company or contact"
                        />
                        <Input
                            label="Due date"
                            type="date"
                            value={form.dueDate}
                            onChange={(value) => setForm({ ...form, dueDate: value })}
                        />
                        <Select
                            label="Priority"
                            value={form.priority}
                            onChange={(value) => setForm({ ...form, priority: value })}
                            options={['Low', 'Medium', 'High']}
                        />

                        <button
                            type="submit"
                            className="w-full rounded-xl bg-brand-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-brand-700"
                        >
                            Add task
                        </button>
                    </form>
                </section>

                <section className="space-y-6">
                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Open tasks
                                </h3>
                                <p className="text-sm text-slate-500">
                                    {openTasks.length} remaining
                                </p>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {openTasks.length === 0 && (
                                <p className="text-sm text-slate-500">No open tasks.</p>
                            )}

                            {openTasks.map((task) => (
                                <TaskRow
                                    key={task.id}
                                    task={task}
                                    onToggle={() => onToggleTask(task.id)}
                                />
                            ))}
                        </div>
                    </div>

                    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
                        <div className="mb-5 flex items-center justify-between">
                            <div>
                                <h3 className="text-lg font-semibold text-slate-900">
                                    Completed tasks
                                </h3>
                                <p className="text-sm text-slate-500">
                                    {completedTasks.length} done
                                </p>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {completedTasks.length === 0 && (
                                <p className="text-sm text-slate-500">No completed tasks.</p>
                            )}

                            {completedTasks.map((task) => (
                                <TaskRow
                                    key={task.id}
                                    task={task}
                                    onToggle={() => onToggleTask(task.id)}
                                />
                            ))}
                        </div>
                    </div>
                </section>
            </div>
        );
    }

    function TaskRow({ task, onToggle }) {
        return (
            <div className="flex flex-col gap-4 rounded-2xl border border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
                <div className="flex items-start gap-3">
                    <button
                        onClick={onToggle}
                        className={classNames(
                            'mt-0.5 flex h-6 w-6 items-center justify-center rounded-full border text-sm transition',
                            task.completed
                                ? 'border-emerald-500 bg-emerald-500 text-white'
                                : 'border-slate-300 bg-white text-transparent hover:border-brand-500'
                        )}
                    >
                        ✓
                    </button>
                    <div>
                        <p className={classNames(
                            'font-medium',
                            task.completed ? 'text-slate-400 line-through' : 'text-slate-900'
                        )}>
                            {task.title}
                        </p>
                        <p className="text-sm text-slate-500">
                            {task.relatedTo || 'General'}
                        </p>
                    </div>
                </div>

                <div className="flex items-center gap-3">
                    <PriorityBadge priority={task.priority} />
                    <span className="text-xs text-slate-500">
                            Due {task.dueDate ? formatDate(task.dueDate) : '-'}
                        </span>
                </div>
            </div>
        );
    }

    function MetricCard({ title, value, hint, color }) {
        const tones = {
            indigo: 'from-indigo-500 to-brand-600',
            emerald: 'from-emerald-500 to-emerald-600',
            amber: 'from-amber-400 to-orange-500',
            sky: 'from-sky-500 to-cyan-500'
        };

        return (
            <div className="rounded-3xl border border-slate-200 bg-white p-5 shadow-soft">
                <div className={classNames(
                    'mb-4 h-2 w-20 rounded-full bg-gradient-to-r',
                    tones[color] || tones.indigo
                )}></div>
                <p className="text-sm font-medium text-slate-500">{title}</p>
                <p className="mt-3 text-3xl font-bold tracking-tight text-slate-900">{value}</p>
                <p className="mt-2 text-sm text-slate-500">{hint}</p>
            </div>
        );
    }

    function Input({ label, value, onChange, placeholder, type = 'text' }) {
        return (
            <label className="block">
                    <span className="mb-1.5 block text-sm font-medium text-slate-700">
                        {label}
                    </span>
                <input
                    type={type}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-brand-500"
                />
            </label>
        );
    }

    function Select({ label, value, onChange, options }) {
        return (
            <label className="block">
                    <span className="mb-1.5 block text-sm font-medium text-slate-700">
                        {label}
                    </span>
                <select
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    className="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-brand-500"
                >
                    {options.map((option) => (
                        <option key={option} value={option}>
                            {option}
                        </option>
                    ))}
                </select>
            </label>
        );
    }

    function StatusBadge({ status }) {
        const styles = {
            Lead: 'bg-amber-100 text-amber-700',
            Active: 'bg-sky-100 text-sky-700',
            Customer: 'bg-emerald-100 text-emerald-700'
        };

        return (
            <span className={classNames(
                'inline-flex rounded-full px-2.5 py-1 text-xs font-semibold',
                styles[status] || 'bg-slate-100 text-slate-700'
            )}>
                    {status}
                </span>
        );
    }

    function PriorityBadge({ priority }) {
        const styles = {
            Low: 'bg-slate-100 text-slate-700',
            Medium: 'bg-amber-100 text-amber-700',
            High: 'bg-rose-100 text-rose-700'
        };

        return (
            <span className={classNames(
                'inline-flex rounded-full px-2.5 py-1 text-xs font-semibold',
                styles[priority] || 'bg-slate-100 text-slate-700'
            )}>
                    {priority}
                </span>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

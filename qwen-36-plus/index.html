<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowCRM — Customer Relationship Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
                        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' }
                    }
                }
            },
            safelist: [
                'bg-brand-50','dark:bg-brand-500/10','text-brand-600','dark:text-brand-400',
                'bg-emerald-50','dark:bg-emerald-500/10','text-emerald-600','dark:text-emerald-400',
                'bg-violet-50','dark:bg-violet-500/10','text-violet-600','dark:text-violet-400',
                'bg-amber-50','dark:bg-amber-500/10','text-amber-600','dark:text-amber-400'
            ]
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .modal-backdrop { animation: backdropIn 0.2s ease-out; }
        @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200 transition-colors duration-200">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

    // ─── Utility ───────────────────────────────────────────────
    const uid = () => Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    const fmt = (d) => new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const fmtCur = (n) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);

    const useLocalStorage = (key, init) => {
        const [val, setVal] = useState(() => {
            try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
        });
        useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
        return [val, setVal];
    };

    // ─── Seed Data ─────────────────────────────────────────────
    const seedContacts = [
        { id:'c1', firstName:'Sarah', lastName:'Johnson', email:'sarah@acme.io', phone:'+1 555-0101', company:'Acme Corp', title:'VP of Sales', status:'active', source:'referral', notes:'Key decision maker', createdAt:'2025-11-12T10:00:00Z' },
        { id:'c2', firstName:'Marcus', lastName:'Chen', email:'marcus@techflow.com', phone:'+1 555-0102', company:'TechFlow', title:'CTO', status:'active', source:'website', notes:'Interested in enterprise plan', createdAt:'2025-12-01T14:30:00Z' },
        { id:'c3', firstName:'Emily', lastName:'Rodriguez', email:'emily@brightstar.co', phone:'+1 555-0103', company:'BrightStar', title:'Marketing Director', status:'lead', source:'linkedin', notes:'Met at conference', createdAt:'2026-01-15T09:00:00Z' },
        { id:'c4', firstName:'James', lastName:'Wilson', email:'james@pinnacle.org', phone:'+1 555-0104', company:'Pinnacle Group', title:'CEO', status:'lead', source:'cold_call', notes:'Follow up next week', createdAt:'2026-02-03T11:00:00Z' },
        { id:'c5', firstName:'Aisha', lastName:'Patel', email:'aisha@nexgen.io', phone:'+1 555-0105', company:'NexGen Solutions', title:'Product Manager', status:'active', source:'referral', notes:'Renewal coming up in March', createdAt:'2026-01-20T16:00:00Z' },
        { id:'c6', firstName:'David', lastName:'Kim', email:'david@cloudpeak.com', phone:'+1 555-0106', company:'CloudPeak', title:'Engineering Lead', status:'inactive', source:'website', notes:'Trial expired', createdAt:'2025-10-05T08:00:00Z' },
        { id:'c7', firstName:'Lisa', lastName:'Thompson', email:'lisa@innovate.co', phone:'+1 555-0107', company:'Innovate Labs', title:'Head of Ops', status:'active', source:'linkedin', notes:'Expanding team, potential upsell', createdAt:'2026-02-18T13:00:00Z' },
        { id:'c8', firstName:'Robert', lastName:'Garcia', email:'robert@summit.io', phone:'+1 555-0108', company:'Summit Digital', title:'Director', status:'lead', source:'website', notes:'Requested demo', createdAt:'2026-03-01T10:30:00Z' },
    ];

    const seedDeals = [
        { id:'d1', contactId:'c1', title:'Acme Corp — Enterprise License', value:48000, stage:'negotiation', probability:75, expectedClose:'2026-05-15', notes:'Annual contract, 200 seats', createdAt:'2025-12-10T10:00:00Z' },
        { id:'d2', contactId:'c2', title:'TechFlow — Platform Integration', value:32000, stage:'proposal', probability:50, expectedClose:'2026-06-01', notes:'Custom API integration required', createdAt:'2026-01-05T14:00:00Z' },
        { id:'d3', contactId:'c3', title:'BrightStar — Marketing Suite', value:15000, stage:'qualification', probability:25, expectedClose:'2026-07-01', notes:'Needs marketing automation', createdAt:'2026-02-01T09:00:00Z' },
        { id:'d4', contactId:'c5', title:'NexGen — Renewal + Upsell', value:24000, stage:'negotiation', probability:85, expectedClose:'2026-04-20', notes:'Adding 50 seats', createdAt:'2026-02-15T11:00:00Z' },
        { id:'d5', contactId:'c4', title:'Pinnacle — Full Platform', value:65000, stage:'discovery', probability:15, expectedClose:'2026-08-01', notes:'Large opportunity, multiple stakeholders', createdAt:'2026-02-20T16:00:00Z' },
        { id:'d6', contactId:'c7', title:'Innovate Labs — Team Expansion', value:18000, stage:'proposal', probability:60, expectedClose:'2026-05-01', notes:'Adding analytics module', createdAt:'2026-03-05T10:00:00Z' },
        { id:'d7', contactId:'c8', title:'Summit Digital — Starter Pack', value:8000, stage:'lead', probability:10, expectedClose:'2026-06-15', notes:'New lead from website', createdAt:'2026-03-10T13:00:00Z' },
    ];

    const seedActivities = [
        { id:'a1', contactId:'c1', type:'call', title:'Quarterly review call', dueDate:'2026-04-10', completed:false, priority:'high', notes:'Discuss renewal terms' },
        { id:'a2', contactId:'c2', type:'meeting', title:'Product demo for TechFlow', dueDate:'2026-04-08', completed:false, priority:'high', notes:'Show API capabilities' },
        { id:'a3', contactId:'c5', type:'email', title:'Send renewal proposal', dueDate:'2026-04-07', completed:false, priority:'medium', notes:'Include upsell pricing' },
        { id:'a4', contactId:'c3', type:'task', title:'Prepare marketing materials', dueDate:'2026-04-15', completed:false, priority:'medium', notes:'Custom deck for BrightStar' },
        { id:'a5', contactId:'c7', type:'call', title:'Follow-up on expansion', dueDate:'2026-04-12', completed:false, priority:'low', notes:'Check on budget approval' },
        { id:'a6', contactId:'c4', type:'meeting', title:'Discovery meeting', dueDate:'2026-04-09', completed:true, priority:'high', notes:'Great meeting, next steps defined' },
        { id:'a7', contactId:'c6', type:'email', title:'Win-back campaign email', dueDate:'2026-04-06', completed:false, priority:'low', notes:'Re-engagement offer' },
    ];

    // ─── Context ───────────────────────────────────────────────
    const AppContext = createContext();

    // ─── Icons (SVG components) ────────────────────────────────
    const Icon = ({ name, size=20, className='' }) => {
        const icons = {
            dashboard: <path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zm0 11h7v7h-7v-7zM3 14h7v7H3v-7z"/>,
            contacts: <><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></>,
            deals: <><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></>,
            activities: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
            plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
            search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
            edit: <><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
            trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></>,
            close: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
            chevronDown: <polyline points="6 9 12 15 18 9"/>,
            chevronRight: <polyline points="9 18 15 12 9 6"/>,
            sun: <><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>,
            moon: <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>,
            menu: <><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>,
            call: <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>,
            meeting: <><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
            email: <><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></>,
            task: <><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></>,
            check: <polyline points="20 6 9 17 4 12"/>,
            dollar: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></>,
            trendUp: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
            users: <><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
            target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
            bell: <><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
            filter: <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>,
            export: <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        };
        return (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {icons[name] || null}
            </svg>
        );
    };

    // ─── Modal ─────────────────────────────────────────────────
    const Modal = ({ open, onClose, title, children, size='md' }) => {
        if (!open) return null;
        const sizes = { sm:'max-w-md', md:'max-w-lg', lg:'max-w-2xl', xl:'max-w-4xl' };
        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
                <div className="modal-backdrop fixed inset-0 bg-black/50 backdrop-blur-sm" />
                <div className={`relative bg-white dark:bg-surface-800 rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] flex flex-col fade-in`} onClick={e=>e.stopPropagation()}>
                    <div className="flex items-center justify-between px-6 py-4 border-b border-surface-200 dark:border-surface-700">
                        <h3 className="text-lg font-semibold">{title}</h3>
                        <button onClick={onClose} className="p-1 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-700 transition-colors"><Icon name="close" size={20}/></button>
                    </div>
                    <div className="overflow-y-auto p-6">{children}</div>
                </div>
            </div>
        );
    };

    // ─── Toast ─────────────────────────────────────────────────
    const ToastContainer = ({ toasts, onDismiss }) => (
        <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
            {toasts.map(t => (
                <div key={t.id} className={`fade-in flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${t.type==='success'?'bg-emerald-500':t.type==='error'?'bg-red-500':'bg-brand-500'}`}>
                    <span>{t.message}</span>
                    <button onClick={()=>onDismiss(t.id)} className="ml-2 opacity-70 hover:opacity-100"><Icon name="close" size={14}/></button>
                </div>
            ))}
        </div>
    );

    // ─── Stat Card ─────────────────────────────────────────────
    const StatCard = ({ icon, label, value, change, color='brand' }) => (
        <div className="bg-white dark:bg-surface-800 rounded-2xl p-5 border border-surface-200 dark:border-surface-700 hover:shadow-lg transition-shadow">
            <div className="flex items-center justify-between mb-3">
                <div className={`p-2.5 rounded-xl bg-${color}-50 dark:bg-${color}-500/10 text-${color}-600 dark:text-${color}-400`}>
                    <Icon name={icon} size={20}/>
                </div>
                {change !== undefined && (
                    <span className={`text-xs font-semibold px-2 py-1 rounded-full ${change>=0?'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400':'bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400'}`}>
          {change>=0?'↑':'↓'}{Math.abs(change)}%
        </span>
                )}
            </div>
            <p className="text-2xl font-bold">{value}</p>
            <p className="text-sm text-surface-500 dark:text-surface-400 mt-1">{label}</p>
        </div>
    );

    // ─── Bar Chart (CSS) ──────────────────────────────────────
    const BarChart = ({ data, height=160 }) => {
        const max = Math.max(...data.map(d=>d.value), 1);
        return (
            <div className="flex items-end gap-2" style={{height}}>
                {data.map((d,i) => (
                    <div key={i} className="flex-1 flex flex-col items-center gap-1">
                        <span className="text-xs font-medium text-surface-600 dark:text-surface-400">{d.value > 999 ? (d.value/1000).toFixed(0)+'k' : d.value}</span>
                        <div className="w-full bg-surface-100 dark:bg-surface-700 rounded-t-lg relative overflow-hidden" style={{height: height - 30}}>
                            <div className="absolute bottom-0 w-full bg-gradient-to-t from-brand-500 to-brand-400 rounded-t-lg transition-all duration-700" style={{height:`${(d.value/max)*100}%`}}/>
                        </div>
                        <span className="text-xs text-surface-500 dark:text-surface-400 truncate w-full text-center">{d.label}</span>
                    </div>
                ))}
            </div>
        );
    };

    // ─── Donut Chart (CSS) ─────────────────────────────────────
    const DonutChart = ({ segments, size=140 }) => {
        const total = segments.reduce((s,seg)=>s+seg.value,0);
        let cum = 0;
        const r = 50, cx = 70, cy = 70;
        const circumference = 2 * Math.PI * r;
        return (
            <div className="flex items-center gap-4">
                <svg width={size} height={size} viewBox="0 0 140 140" className="transform -rotate-90">
                    {segments.map((seg,i)=>{
                        const pct = seg.value/total;
                        const offset = cum * circumference;
                        cum += pct;
                        return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color} strokeWidth="20" strokeDasharray={`${pct*circumference} ${circumference}`} strokeDashoffset={-offset} className="transition-all duration-500"/>;
                    })}
                </svg>
                <div className="flex flex-col gap-2">
                    {segments.map((seg,i)=>(
                        <div key={i} className="flex items-center gap-2 text-sm">
                            <div className="w-3 h-3 rounded-full" style={{background:seg.color}}/>
                            <span className="text-surface-600 dark:text-surface-400">{seg.label}</span>
                            <span className="font-semibold ml-auto">{seg.value}</span>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    // ─── Dashboard ─────────────────────────────────────────────
    const Dashboard = () => {
        const { contacts, deals, activities } = useContext(AppContext);
        const totalRevenue = deals.filter(d=>d.stage==='won').reduce((s,d)=>s+d.value,0);
        const pipelineValue = deals.filter(d=>!['won','lost'].includes(d.stage)).reduce((s,d)=>s+d.value,0);
        const activeContacts = contacts.filter(c=>c.status==='active').length;
        const openTasks = activities.filter(a=>!a.completed).length;

        const monthlyData = [
            {label:'Nov',value:28000},{label:'Dec',value:35000},{label:'Jan',value:22000},
            {label:'Feb',value:41000},{label:'Mar',value:38000},{label:'Apr',value:47000}
        ];

        const stageSegments = [
            {label:'Lead',value:deals.filter(d=>d.stage==='lead').length,color:'#94a3b8'},
            {label:'Discovery',value:deals.filter(d=>d.stage==='discovery').length,color:'#818cf8'},
            {label:'Qualification',value:deals.filter(d=>d.stage==='qualification').length,color:'#a78bfa'},
            {label:'Proposal',value:deals.filter(d=>d.stage==='proposal').length,color:'#6366f1'},
            {label:'Negotiation',value:deals.filter(d=>d.stage==='negotiation').length,color:'#4f46e5'},
            {label:'Won',value:deals.filter(d=>d.stage==='won').length,color:'#10b981'},
        ];

        const recentActivities = activities.slice(0,5);

        return (
            <div className="fade-in space-y-6">
                <div>
                    <h1 className="text-2xl font-bold">Dashboard</h1>
                    <p className="text-surface-500 dark:text-surface-400 mt-1">Welcome back! Here's what's happening.</p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <StatCard icon="users" label="Active Contacts" value={activeContacts} change={12} color="brand"/>
                    <StatCard icon="dollar" label="Pipeline Value" value={fmtCur(pipelineValue)} change={8} color="emerald"/>
                    <StatCard icon="target" label="Open Deals" value={deals.filter(d=>!['won','lost'].includes(d.stage)).length} change={-3} color="violet"/>
                    <StatCard icon="activities" label="Open Tasks" value={openTasks} change={-5} color="amber"/>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-4">Revenue Trend</h3>
                        <BarChart data={monthlyData} height={180}/>
                    </div>
                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-4">Deal Pipeline</h3>
                        <DonutChart segments={stageSegments} size={130}/>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-4">Top Deals</h3>
                        <div className="space-y-3">
                            {deals.filter(d=>!['won','lost'].includes(d.stage)).sort((a,b)=>b.value-a.value).slice(0,5).map(d=>{
                                const contact = contacts.find(c=>c.id===d.contactId);
                                return (
                                    <div key={d.id} className="flex items-center justify-between py-2 border-b border-surface-100 dark:border-surface-700 last:border-0">
                                        <div>
                                            <p className="text-sm font-medium">{d.title}</p>
                                            <p className="text-xs text-surface-500 dark:text-surface-400">{contact?.company || 'Unknown'}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-sm font-semibold">{fmtCur(d.value)}</p>
                                            <span className="text-xs text-surface-400 capitalize">{d.stage}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-4">Recent Activities</h3>
                        <div className="space-y-3">
                            {recentActivities.map(a=>{
                                const contact = contacts.find(c=>c.id===a.contactId);
                                const typeColors = {call:'bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400', meeting:'bg-purple-100 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400', email:'bg-amber-100 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400', task:'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400'};
                                return (
                                    <div key={a.id} className="flex items-center gap-3 py-2">
                                        <div className={`p-1.5 rounded-lg ${typeColors[a.type]||'bg-surface-100'}`}>
                                            <Icon name={a.type} size={14}/>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <p className={`text-sm truncate ${a.completed?'line-through text-surface-400':''}`}>{a.title}</p>
                                            <p className="text-xs text-surface-400">{contact?.firstName} {contact?.lastName} · {fmt(a.dueDate)}</p>
                                        </div>
                                        {a.completed && <Icon name="check" size={16} className="text-emerald-500"/>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // ─── Contacts View ─────────────────────────────────────────
    const ContactsView = () => {
        const { contacts, setContacts, deals, activities, addToast } = useContext(AppContext);
        const [search, setSearch] = useState('');
        const [statusFilter, setStatusFilter] = useState('all');
        const [modal, setModal] = useState(false);
        const [editing, setEditing] = useState(null);
        const [form, setForm] = useState({firstName:'',lastName:'',email:'',phone:'',company:'',title:'',status:'lead',source:'website',notes:''});
        const [detailContact, setDetailContact] = useState(null);

        const filtered = useMemo(()=> contacts.filter(c=>{
            const q = search.toLowerCase();
            const match = !q || `${c.firstName} ${c.lastName} ${c.email} ${c.company} ${c.title}`.toLowerCase().includes(q);
            const sf = statusFilter==='all' || c.status===statusFilter;
            return match && sf;
        }),[contacts,search,statusFilter]);

        const openAdd = ()=>{ setEditing(null); setForm({firstName:'',lastName:'',email:'',phone:'',company:'',title:'',status:'lead',source:'website',notes:''}); setModal(true); };
        const openEdit = (c)=>{ setEditing(c); setForm({...c}); setModal(true); };
        const save = ()=>{
            if(!form.firstName||!form.lastName){addToast('First and last name required','error');return;}
            if(editing){
                setContacts(prev=>prev.map(c=>c.id===editing.id?{...c,...form}:c));
                addToast('Contact updated','success');
            } else {
                setContacts(prev=>[...prev,{id:uid(),...form,createdAt:new Date().toISOString()}]);
                addToast('Contact created','success');
            }
            setModal(false);
        };
        const remove = (id)=>{
            setContacts(prev=>prev.filter(c=>c.id!==id));
            addToast('Contact deleted','success');
        };

        const statusBadge = (s)=>{
            const m = {active:'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400',lead:'bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400',inactive:'bg-surface-100 text-surface-500 dark:bg-surface-700 dark:text-surface-400'};
            return <span className={`text-xs font-medium px-2 py-0.5 rounded-full capitalize ${m[s]||''}`}>{s}</span>;
        };

        if(detailContact) {
            const c = detailContact;
            const cDeals = deals.filter(d=>d.contactId===c.id);
            const cActivities = activities.filter(a=>a.contactId===c.id);
            return (
                <div className="fade-in space-y-6">
                    <button onClick={()=>setDetailContact(null)} className="text-sm text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1">
                        <Icon name="chevronRight" size={14} className="rotate-180"/> Back to contacts
                    </button>
                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <div className="flex items-start justify-between">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white text-xl font-bold">
                                    {c.firstName[0]}{c.lastName[0]}
                                </div>
                                <div>
                                    <h2 className="text-xl font-bold">{c.firstName} {c.lastName}</h2>
                                    <p className="text-surface-500 dark:text-surface-400">{c.title} at {c.company}</p>
                                    {statusBadge(c.status)}
                                </div>
                            </div>
                            <button onClick={()=>openEdit(c)} className="p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-700"><Icon name="edit" size={18}/></button>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
                            <div><label className="text-xs text-surface-400 uppercase tracking-wider">Email</label><p className="font-medium mt-1">{c.email}</p></div>
                            <div><label className="text-xs text-surface-400 uppercase tracking-wider">Phone</label><p className="font-medium mt-1">{c.phone||'—'}</p></div>
                            <div><label className="text-xs text-surface-400 uppercase tracking-wider">Source</label><p className="font-medium mt-1 capitalize">{c.source.replace('_',' ')}</p></div>
                            <div><label className="text-xs text-surface-400 uppercase tracking-wider">Created</label><p className="font-medium mt-1">{fmt(c.createdAt)}</p></div>
                            {c.notes && <div className="sm:col-span-2"><label className="text-xs text-surface-400 uppercase tracking-wider">Notes</label><p className="mt-1 text-surface-600 dark:text-surface-300">{c.notes}</p></div>}
                        </div>
                    </div>

                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-3">Deals ({cDeals.length})</h3>
                        {cDeals.length ? cDeals.map(d=>(
                            <div key={d.id} className="flex justify-between py-2 border-b border-surface-100 dark:border-surface-700 last:border-0">
                                <span className="text-sm">{d.title}</span>
                                <span className="text-sm font-medium">{fmtCur(d.value)} <span className="text-surface-400 capitalize text-xs">({d.stage})</span></span>
                            </div>
                        )) : <p className="text-sm text-surface-400">No deals</p>}
                    </div>

                    <div className="bg-white dark:bg-surface-800 rounded-2xl p-6 border border-surface-200 dark:border-surface-700">
                        <h3 className="font-semibold mb-3">Activities ({cActivities.length})</h3>
                        {cActivities.length ? cActivities.map(a=>(
                            <div key={a.id} className="flex items-center gap-3 py-2 border-b border-surface-100 dark:border-surface-700 last:border-0">
                                <Icon name={a.type} size={16} className="text-surface-400"/>
                                <div className="flex-1">
                                    <span className={`text-sm ${a.completed?'line-through text-surface-400':''}`}>{a.title}</span>
                                    <p className="text-xs text-surface-400">{fmt(a.dueDate)} · {a.priority}</p>
                                </div>
                            </div>
                        )) : <p className="text-sm text-surface-400">No activities</p>}
                    </div>
                </div>
            );
        }

        return (
            <div className="fade-in space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 className="text-2xl font-bold">Contacts</h1>
                        <p className="text-surface-500 dark:text-surface-400 mt-1">{contacts.length} total contacts</p>
                    </div>
                    <button onClick={openAdd} className="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors shadow-lg shadow-brand-500/25">
                        <Icon name="plus" size={16}/> Add Contact
                    </button>
                </div>

                <div className="flex flex-col sm:flex-row gap-3">
                    <div className="relative flex-1">
                        <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-surface-400"/>
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search contacts..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-shadow"/>
                    </div>
                    <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="px-4 py-2.5 rounded-xl border border-surface-200 dark:border-surface-700 bg-white dark:bg-surface-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="lead">Lead</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>

                <div className="bg-white dark:bg-surface-800 rounded-2xl border border-surface-200 dark:border-surface-700 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <thead>
                            <tr className="border-b border-surface-200 dark:border-surface-700 text-left text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">
                                <th className="px-5 py-3 font-medium">Contact</th>
                                <th className="px-5 py-3 font-medium hidden sm:table-cell">Company</th>
                                <th className="px-5 py-3 font-medium hidden md:table-cell">Status</th>
                                <th className="px-5 py-3 font-medium hidden lg:table-cell">Source</th>
                                <th className="px-5 py-3 font-medium text-right">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            {filtered.map(c=>(
                                <tr key={c.id} className="border-b border-surface-100 dark:border-surface-700/50 hover:bg-surface-50 dark:hover:bg-surface-700/30 transition-colors cursor-pointer" onClick={()=>setDetailContact(c)}>
                                    <td className="px-5 py-3.5">
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">{c.firstName[0]}{c.lastName[0]}</div>
                                            <div className="min-w-0">
                                                <p className="font-medium truncate">{c.firstName} {c.lastName}</p>
                                                <p className="text-xs text-surface-400 truncate">{c.email}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td className="px-5 py-3.5 hidden sm:table-cell text-surface-600 dark:text-surface-300">{c.company}</td>
                                    <td className="px-5 py-3.5 hidden md:table-cell">{statusBadge(c.status)}</td>
                                    <td className="px-5 py-3.5 hidden lg:table-cell text-surface-500 capitalize">{c.source.replace('_',' ')}</td>
                                    <td className="px-5 py-3.5 text-right">
                                        <div className="flex items-center justify-end gap-1" onClick={e=>e.stopPropagation()}>
                                            <button onClick={()=>openEdit(c)} className="p-1.5 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-700 text-surface-400 hover:text-brand-500 transition-colors"><Icon name="edit" size={15}/></button>
                                            <button onClick={()=>remove(c.id)} className="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-500/10 text-surface-400 hover:text-red-500 transition-colors"><Icon name="trash" size={15}/></button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                            </tbody>
                        </table>
                    </div>
                    {!filtered.length && <div className="py-16 text-center text-surface-400"><Icon name="contacts" size={40} className="mx-auto mb-3 opacity-30"/><p>No contacts found</p></div>}
                </div>

                <Modal open={modal} onClose={()=>setModal(false)} title={editing?'Edit Contact':'New Contact'}>
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">First Name *</label><input value={form.firstName} onChange={e=>setForm({...form,firstName:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                            <div><label className="block text-sm font-medium mb-1">Last Name *</label><input value={form.lastName} onChange={e=>setForm({...form,lastName:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">Email</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                            <div><label className="block text-sm font-medium mb-1">Company</label><input value={form.company} onChange={e=>setForm({...form,company:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                            <div><label className="block text-sm font-medium mb-1">Status</label>
                                <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    <option value="lead">Lead</option><option value="active">Active</option><option value="inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">Source</label>
                            <select value={form.source} onChange={e=>setForm({...form,source:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="website">Website</option><option value="referral">Referral</option><option value="linkedin">LinkedIn</option><option value="cold_call">Cold Call</option><option value="event">Event</option><option value="other">Other</option>
                            </select>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={3} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"/></div>
                        <div className="flex justify-end gap-3 pt-2">
                            <button onClick={()=>setModal(false)} className="px-4 py-2 rounded-xl text-sm font-medium border border-surface-200 dark:border-surface-600 hover:bg-surface-50 dark:hover:bg-surface-700 transition-colors">Cancel</button>
                            <button onClick={save} className="px-4 py-2 rounded-xl text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white transition-colors shadow-lg shadow-brand-500/25">{editing?'Update':'Create'}</button>
                        </div>
                    </div>
                </Modal>
            </div>
        );
    };

    // ─── Deals Pipeline ────────────────────────────────────────
    const DealsView = () => {
        const { deals, setDeals, contacts, addToast } = useContext(AppContext);
        const [modal, setModal] = useState(false);
        const [editing, setEditing] = useState(null);
        const [form, setForm] = useState({contactId:'',title:'',value:0,stage:'lead',probability:10,expectedClose:'',notes:''});
        const [dragDeal, setDragDeal] = useState(null);

        const stages = ['lead','discovery','qualification','proposal','negotiation','won','lost'];
        const stageLabels = {lead:'Lead',discovery:'Discovery',qualification:'Qualification',proposal:'Proposal',negotiation:'Negotiation',won:'Won',lost:'Lost'};
        const stageColors = {lead:'border-surface-300 dark:border-surface-600',discovery:'border-slate-400 dark:border-slate-500',qualification:'border-blue-400',proposal:'border-violet-400',negotiation:'border-brand-500',won:'border-emerald-500',lost:'border-red-400'};

        const openAdd = ()=>{ setEditing(null); setForm({contactId:'',title:'',value:0,stage:'lead',probability:10,expectedClose:'',notes:''}); setModal(true); };
        const openEdit = (d)=>{ setEditing(d); setForm({...d}); setModal(true); };
        const save = ()=>{
            if(!form.title){addToast('Deal title required','error');return;}
            if(editing){
                setDeals(prev=>prev.map(d=>d.id===editing.id?{...d,...form}:d));
                addToast('Deal updated','success');
            } else {
                setDeals(prev=>[...prev,{id:uid(),...form,createdAt:new Date().toISOString()}]);
                addToast('Deal created','success');
            }
            setModal(false);
        };
        const remove = (id)=>{ setDeals(prev=>prev.filter(d=>d.id!==id)); addToast('Deal deleted','success'); };

        const moveStage = (dealId, newStage)=>{
            setDeals(prev=>prev.map(d=>d.id===dealId?{...d,stage:newStage,probability:newStage==='won'?100:newStage==='lost'?0:d.probability}:d));
        };

        const onDragStart = (e, dealId)=>{ setDragDeal(dealId); e.dataTransfer.effectAllowed='move'; };
        const onDragOver = (e)=>{ e.preventDefault(); };
        const onDrop = (e, stage)=>{
            e.preventDefault();
            if(dragDeal) moveStage(dragDeal, stage);
            setDragDeal(null);
        };

        return (
            <div className="fade-in space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 className="text-2xl font-bold">Deals Pipeline</h1>
                        <p className="text-surface-500 dark:text-surface-400 mt-1">Drag and drop deals between stages</p>
                    </div>
                    <button onClick={openAdd} className="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors shadow-lg shadow-brand-500/25">
                        <Icon name="plus" size={16}/> Add Deal
                    </button>
                </div>

                <div className="flex gap-4 overflow-x-auto pb-4">
                    {stages.map(stage=>{
                        const stageDeals = deals.filter(d=>d.stage===stage);
                        const totalValue = stageDeals.reduce((s,d)=>s+d.value,0);
                        return (
                            <div key={stage} className="min-w-[260px] flex-1" onDragOver={onDragOver} onDrop={e=>onDrop(e,stage)}>
                                <div className={`bg-surface-100 dark:bg-surface-800/50 rounded-2xl p-3 border-t-4 ${stageColors[stage]}`}>
                                    <div className="flex items-center justify-between mb-3 px-1">
                                        <h3 className="font-semibold text-sm capitalize">{stageLabels[stage]}</h3>
                                        <span className="text-xs font-medium text-surface-400 bg-white dark:bg-surface-700 px-2 py-0.5 rounded-full">{stageDeals.length}</span>
                                    </div>
                                    <p className="text-xs text-surface-400 mb-3 px-1">{fmtCur(totalValue)}</p>
                                    <div className="space-y-2 min-h-[60px]">
                                        {stageDeals.map(d=>{
                                            const contact = contacts.find(c=>c.id===d.contactId);
                                            return (
                                                <div key={d.id} draggable onDragStart={e=>onDragStart(e,d.id)} className="bg-white dark:bg-surface-800 rounded-xl p-3 shadow-sm border border-surface-200 dark:border-surface-700 cursor-grab active:cursor-grabbing hover:shadow-md transition-shadow group">
                                                    <p className="text-sm font-medium truncate">{d.title}</p>
                                                    <p className="text-xs text-surface-400 mt-0.5">{contact?.company || 'No contact'}</p>
                                                    <div className="flex items-center justify-between mt-2">
                                                        <span className="text-sm font-bold text-brand-600 dark:text-brand-400">{fmtCur(d.value)}</span>
                                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button onClick={()=>openEdit(d)} className="p-1 rounded hover:bg-surface-100 dark:hover:bg-surface-700 text-surface-400"><Icon name="edit" size={13}/></button>
                                                            <button onClick={()=>remove(d.id)} className="p-1 rounded hover:bg-red-50 dark:hover:bg-red-500/10 text-surface-400 hover:text-red-500"><Icon name="trash" size={13}/></button>
                                                        </div>
                                                    </div>
                                                    {d.expectedClose && <p className="text-xs text-surface-400 mt-1">Close: {fmt(d.expectedClose)}</p>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>

                <Modal open={modal} onClose={()=>setModal(false)} title={editing?'Edit Deal':'New Deal'} size="lg">
                    <div className="space-y-4">
                        <div><label className="block text-sm font-medium mb-1">Deal Title *</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Contact</label>
                                <select value={form.contactId} onChange={e=>setForm({...form,contactId:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    <option value="">Select contact...</option>
                                    {contacts.map(c=><option key={c.id} value={c.id}>{c.firstName} {c.lastName} — {c.company}</option>)}
                                </select>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Value ($)</label><input type="number" value={form.value} onChange={e=>setForm({...form,value:parseInt(e.target.value)||0})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        </div>
                        <div className="grid grid-cols-3 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Stage</label>
                                <select value={form.stage} onChange={e=>setForm({...form,stage:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    {stages.map(s=><option key={s} value={s}>{stageLabels[s]}</option>)}
                                </select>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Probability (%)</label><input type="number" min="0" max="100" value={form.probability} onChange={e=>setForm({...form,probability:parseInt(e.target.value)||0})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                            <div><label className="block text-sm font-medium mb-1">Expected Close</label><input type="date" value={form.expectedClose} onChange={e=>setForm({...form,expectedClose:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={3} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"/></div>
                        <div className="flex justify-end gap-3 pt-2">
                            <button onClick={()=>setModal(false)} className="px-4 py-2 rounded-xl text-sm font-medium border border-surface-200 dark:border-surface-600 hover:bg-surface-50 dark:hover:bg-surface-700 transition-colors">Cancel</button>
                            <button onClick={save} className="px-4 py-2 rounded-xl text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white transition-colors shadow-lg shadow-brand-500/25">{editing?'Update':'Create'}</button>
                        </div>
                    </div>
                </Modal>
            </div>
        );
    };

    // ─── Activities View ───────────────────────────────────────
    const ActivitiesView = () => {
        const { activities, setActivities, contacts, addToast } = useContext(AppContext);
        const [modal, setModal] = useState(false);
        const [editing, setEditing] = useState(null);
        const [form, setForm] = useState({contactId:'',type:'task',title:'',dueDate:'',completed:false,priority:'medium',notes:''});
        const [filter, setFilter] = useState('all');

        const filtered = useMemo(()=>{
            if(filter==='completed') return activities.filter(a=>a.completed);
            if(filter==='pending') return activities.filter(a=>!a.completed);
            return activities;
        },[activities,filter]);

        const openAdd = ()=>{ setEditing(null); setForm({contactId:'',type:'task',title:'',dueDate:new Date().toISOString().split('T')[0],completed:false,priority:'medium',notes:''}); setModal(true); };
        const openEdit = (a)=>{ setEditing(a); setForm({...a}); setModal(true); };
        const save = ()=>{
            if(!form.title){addToast('Title required','error');return;}
            if(editing){
                setActivities(prev=>prev.map(a=>a.id===editing.id?{...a,...form}:a));
                addToast('Activity updated','success');
            } else {
                setActivities(prev=>[...prev,{id:uid(),...form}]);
                addToast('Activity created','success');
            }
            setModal(false);
        };
        const remove = (id)=>{ setActivities(prev=>prev.filter(a=>a.id!==id)); addToast('Activity deleted','success'); };
        const toggleComplete = (id)=>{
            setActivities(prev=>prev.map(a=>a.id===id?{...a,completed:!a.completed}:a));
        };

        const typeIcons = {call:'call',meeting:'meeting',email:'email',task:'task'};
        const typeColors = {call:'text-blue-500 bg-blue-50 dark:bg-blue-500/10',meeting:'text-purple-500 bg-purple-50 dark:bg-purple-500/10',email:'text-amber-500 bg-amber-50 dark:bg-amber-500/10',task:'text-emerald-500 bg-emerald-50 dark:bg-emerald-500/10'};
        const priorityColors = {high:'text-red-500',medium:'text-amber-500',low:'text-surface-400'};

        return (
            <div className="fade-in space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 className="text-2xl font-bold">Activities</h1>
                        <p className="text-surface-500 dark:text-surface-400 mt-1">{activities.filter(a=>!a.completed).length} open tasks</p>
                    </div>
                    <button onClick={openAdd} className="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors shadow-lg shadow-brand-500/25">
                        <Icon name="plus" size={16}/> Add Activity
                    </button>
                </div>

                <div className="flex gap-2">
                    {['all','pending','completed'].map(f=>(
                        <button key={f} onClick={()=>setFilter(f)} className={`px-4 py-2 rounded-xl text-sm font-medium transition-colors ${filter===f?'bg-brand-600 text-white shadow-lg shadow-brand-500/25':'bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 hover:bg-surface-50 dark:hover:bg-surface-700'}`}>
                            {f.charAt(0).toUpperCase()+f.slice(1)}
                        </button>
                    ))}
                </div>

                <div className="space-y-2">
                    {filtered.sort((a,b)=>{
                        if(a.completed!==b.completed) return a.completed?1:-1;
                        return new Date(a.dueDate)-new Date(b.dueDate);
                    }).map(a=>{
                        const contact = contacts.find(c=>c.id===a.contactId);
                        return (
                            <div key={a.id} className={`bg-white dark:bg-surface-800 rounded-xl p-4 border border-surface-200 dark:border-surface-700 flex items-center gap-4 hover:shadow-md transition-all ${a.completed?'opacity-60':''}`}>
                                <button onClick={()=>toggleComplete(a.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${a.completed?'bg-emerald-500 border-emerald-500 text-white':'border-surface-300 dark:border-surface-600 hover:border-brand-500'}`}>
                                    {a.completed && <Icon name="check" size={14}/>}
                                </button>
                                <div className={`p-2 rounded-lg ${typeColors[a.type]||'bg-surface-100'}`}>
                                    <Icon name={typeIcons[a.type]||'task'} size={18}/>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className={`text-sm font-medium truncate ${a.completed?'line-through text-surface-400':''}`}>{a.title}</p>
                                    <p className="text-xs text-surface-400">{contact?`${contact.firstName} ${contact.lastName}`:'No contact'} · {fmt(a.dueDate)}</p>
                                    {a.notes && <p className="text-xs text-surface-400 mt-0.5 truncate">{a.notes}</p>}
                                </div>
                                <span className={`text-xs font-medium capitalize ${priorityColors[a.priority]||''}`}>{a.priority}</span>
                                <div className="flex gap-1">
                                    <button onClick={()=>openEdit(a)} className="p-1.5 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-700 text-surface-400 hover:text-brand-500 transition-colors"><Icon name="edit" size={14}/></button>
                                    <button onClick={()=>remove(a.id)} className="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-500/10 text-surface-400 hover:text-red-500 transition-colors"><Icon name="trash" size={14}/></button>
                                </div>
                            </div>
                        );
                    })}
                    {!filtered.length && <div className="py-16 text-center text-surface-400"><Icon name="activities" size={40} className="mx-auto mb-3 opacity-30"/><p>No activities found</p></div>}
                </div>

                <Modal open={modal} onClose={()=>setModal(false)} title={editing?'Edit Activity':'New Activity'}>
                    <div className="space-y-4">
                        <div><label className="block text-sm font-medium mb-1">Title *</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Contact</label>
                                <select value={form.contactId} onChange={e=>setForm({...form,contactId:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    <option value="">Select contact...</option>
                                    {contacts.map(c=><option key={c.id} value={c.id}>{c.firstName} {c.lastName} — {c.company}</option>)}
                                </select>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Type</label>
                                <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    <option value="task">Task</option><option value="call">Call</option><option value="meeting">Meeting</option><option value="email">Email</option>
                                </select>
                            </div>
                        </div>
                        <div className="grid grid-cols-3 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Due Date</label><input type="date" value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/></div>
                            <div><label className="block text-sm font-medium mb-1">Priority</label>
                                <select value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                    <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
                                </select>
                            </div>
                            <div className="flex items-end"><label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={form.completed} onChange={e=>setForm({...form,completed:e.target.checked})} className="rounded border-surface-300 text-brand-600 focus:ring-brand-500"/> Completed</label></div>
                        </div>
                        <div><label className="block text-sm font-medium mb-1">Notes</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={3} className="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-surface-600 bg-white dark:bg-surface-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none"/></div>
                        <div className="flex justify-end gap-3 pt-2">
                            <button onClick={()=>setModal(false)} className="px-4 py-2 rounded-xl text-sm font-medium border border-surface-200 dark:border-surface-600 hover:bg-surface-50 dark:hover:bg-surface-700 transition-colors">Cancel</button>
                            <button onClick={save} className="px-4 py-2 rounded-xl text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white transition-colors shadow-lg shadow-brand-500/25">{editing?'Update':'Create'}</button>
                        </div>
                    </div>
                </Modal>
            </div>
        );
    };

    // ─── Main App ──────────────────────────────────────────────
    const App = () => {
        const [dark, setDark] = useLocalStorage('crm-dark', false);
        const [page, setPage] = useState('dashboard');
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [contacts, setContacts] = useLocalStorage('crm-contacts', seedContacts);
        const [deals, setDeals] = useLocalStorage('crm-deals', seedDeals);
        const [activities, setActivities] = useLocalStorage('crm-activities', seedActivities);
        const [toasts, setToasts] = useState([]);

        useEffect(()=>{
            document.documentElement.classList.toggle('dark', dark);
        },[dark]);

        const addToast = useCallback((message, type='info')=>{
            const id = uid();
            setToasts(prev=>[...prev,{id,message,type}]);
            setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),3000);
        },[]);

        const navItems = [
            {id:'dashboard',label:'Dashboard',icon:'dashboard'},
            {id:'contacts',label:'Contacts',icon:'contacts'},
            {id:'deals',label:'Deals',icon:'deals'},
            {id:'activities',label:'Activities',icon:'activities'},
        ];

        const renderPage = ()=>{
            switch(page){
                case 'dashboard': return <Dashboard/>;
                case 'contacts': return <ContactsView/>;
                case 'deals': return <DealsView/>;
                case 'activities': return <ActivitiesView/>;
                default: return <Dashboard/>;
            }
        };

        const contextValue = { contacts, setContacts, deals, setDeals, activities, setActivities, addToast };

        return (
            <AppContext.Provider value={contextValue}>
                <div className="flex h-screen overflow-hidden">
                    {/* Mobile overlay */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/40 z-30 lg:hidden" onClick={()=>setSidebarOpen(false)}/>}

                    {/* Sidebar */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-surface-900 border-r border-surface-200 dark:border-surface-800 flex flex-col transition-transform duration-300 ${sidebarOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'}`}>
                        <div className="px-6 py-5 border-b border-surface-200 dark:border-surface-800">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight">FlowCRM</h1>
                                    <p className="text-xs text-surface-400">Sales Platform</p>
                                </div>
                            </div>
                        </div>

                        <nav className="flex-1 px-3 py-4 space-y-1">
                            {navItems.map(item=>(
                                <button key={item.id} onClick={()=>{setPage(item.id);setSidebarOpen(false);}} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${page===item.id?'bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 shadow-sm':'text-surface-600 dark:text-surface-400 hover:bg-surface-50 dark:hover:bg-surface-800'}`}>
                                    <Icon name={item.icon} size={20}/>
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="px-3 py-4 border-t border-surface-200 dark:border-surface-800">
                            <div className="flex items-center gap-3 px-3 py-2">
                                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-violet-400 to-violet-600 flex items-center justify-center text-white text-xs font-bold">JD</div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-medium truncate">John Doe</p>
                                    <p className="text-xs text-surface-400 truncate">john@flowcrm.io</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 flex flex-col overflow-hidden">
                        {/* Top bar */}
                        <header className="bg-white/80 dark:bg-surface-900/80 backdrop-blur-xl border-b border-surface-200 dark:border-surface-800 px-4 lg:px-6 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button onClick={()=>setSidebarOpen(true)} className="lg:hidden p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800"><Icon name="menu" size={20}/></button>
                                <h2 className="text-sm text-surface-500 dark:text-surface-400 capitalize">{page === 'dashboard' ? 'Dashboard' : page}</h2>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={()=>setDark(!dark)} className="p-2 rounded-xl hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors">
                                    <Icon name={dark?'sun':'moon'} size={18}/>
                                </button>
                                <button className="p-2 rounded-xl hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors relative">
                                    <Icon name="bell" size={18}/>
                                    <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"/>
                                </button>
                            </div>
                        </header>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-4 lg:p-6">
                            {renderPage()}
                        </div>
                    </main>
                </div>

                <ToastContainer toasts={toasts} onDismiss={(id)=>setToasts(prev=>prev.filter(t=>t.id!==id))}/>
            </AppContext.Provider>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
